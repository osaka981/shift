<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪急配 シフト表</title>
<style>
  :root{
    --bg:#10141a; --bg2:#161b23; --bg3:#1d232d; --brd:#2b333f; --brd2:#39424f;
    --txt:#e8edf4; --txt2:#97a3b4; --accent:#2f80ed; --grn:#009c5a; --amb:#e08b1f; --red:#d9534f;
    --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root:not([data-theme="dark"]){ }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6f9; --bg2:#fff; --bg3:#eef1f6; --brd:#d8dee8; --brd2:#c3ccd9;
      --txt:#1b2430; --txt2:#5d6b7d;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
  h1{font-size:15px;margin:0;font-weight:700;}
  .ver{font-family:var(--mono);font-size:10px;color:var(--txt2);}
  .wrap{padding:12px 14px 40px;max-width:100%;}
  .card{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:12px;}
  .fi{background:var(--bg3);border:1px solid var(--brd2);border-radius:5px;padding:6px 9px;color:var(--txt);
    font-family:inherit;font-size:12px;outline:none;max-width:100%;}
  .btn{border:1px solid var(--brd2);background:var(--bg3);color:var(--txt);border-radius:6px;
    padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.grn{background:var(--grn);border-color:var(--grn);color:#fff;}
  .btn.gh{background:transparent;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--txt2);}
  .xs{font-size:10.5px;}
  .tw{overflow:auto;max-height:64vh;border:1px solid var(--brd);border-radius:6px;}
  table{border-collapse:collapse;font-size:11px;width:100%;}
  th,td{border:1px solid var(--brd);padding:3px 4px;text-align:center;white-space:nowrap;}
  thead th{position:sticky;top:0;background:var(--bg3);z-index:2;}
  tbody td:first-child,thead th:first-child{position:sticky;left:0;background:var(--bg2);text-align:left;z-index:1;}
  tfoot td{background:var(--bg3);font-weight:700;}
  .cell{cursor:pointer;user-select:none;}
  .al{border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:10px;}
  .al-w{background:rgba(224,139,31,.12);border:1px solid rgba(224,139,31,.4);}
  .al-e{background:rgba(217,83,79,.12);border:1px solid rgba(217,83,79,.4);}
  .mono{font-family:var(--mono);}
</style>
</head>
<body>
<header>
  <div>
    <h1>大阪急配　シフト表</h1>
    <div class="ver" id="app-ver">ver 2026-09-24.3</div>
  </div>
  <div class="row" style="margin-left:auto;">
    <select id="sh-off" class="fi"></select>
    <input type="month" id="sh-mon" class="fi">
    <span id="fb-state" class="xs muted">接続中…</span>
  </div>
</header>

<div class="wrap">
  <div class="card" id="fc-card">
    <div class="row" style="align-items:flex-end;">
      <div>
        <div class="xs muted">月の予測合計（持出）</div>
        <input type="number" id="fc-total" class="fi" style="width:110px;" placeholder="例 21000">
      </div>
      <div>
        <div class="xs muted">昨対（%）</div>
        <input type="number" id="fc-yoy" class="fi" style="width:80px;" placeholder="例 105">
      </div>
      <div class="xs muted" id="fc-ly"></div>
      <button class="btn gh" onclick="applyYoy()">昨対から計算</button>
      <button class="btn grn" onclick="saveForecast()">予測を保存</button>
      <label class="btn gh" style="display:inline-block;">セールCSVを読み込む
        <input type="file" id="fc-csv" accept=".csv,text/csv" style="display:none;" onchange="importSaleCsv(this)">
      </label>
      <button class="btn gh" onclick="checkLastYear()">前年で答え合わせ</button>
      <span class="xs muted" id="fc-note" style="flex-basis:100%;"></span>
    </div>
  </div>
  <div class="card">
    <div id="sh-root"><div class="al al-w">読み込み中です…</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously, onIdTokenChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
window._fbImports = { initializeApp, getDatabase, ref, set, onValue, getAuth, signInAnonymously, onIdTokenChanged };
document.dispatchEvent(new Event('fb-sdk-ready'));
</script>

<script>
'use strict';
const APP_VER = '2026-09-24.3';
console.log('[シフト表] APP_VER', APP_VER);

const FB_CONFIG = {
  apiKey: "AIzaSyDDsNZnlG3swyRtuCbMjkUkZpH4X68gUiI",
  authDomain: "osq-report-3db91.firebaseapp.com",
  databaseURL: "https://osq-report-3db91-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "osq-report-3db91",
  storageBucket: "osq-report-3db91.firebasestorage.app",
  messagingSenderId: "86627546503",
  appId: "1:86627546503:web:62d338fb75ebaa91bbcf22"
};

const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const _ymNorm = v => String(v||'').replace(/\//g,'-').slice(0,7);

// ── データ（経営管理と同じFirebaseを見る） ──
const D = {
  staff: lsGet('nikki_staff_full', []) || [],
  locations: lsGet('nikki_locations', []) || [],
  departments: lsGet('nikki_departments', []) || [],
  delivery: lsGet('nikki_delivery', []) || [],
  shifts: lsGet('nikki_shifts', {}) || {},
  saleEvents: lsGet('nikki_sale_events', []) || [],   // ★ 2026-09-24.3: セールカレンダー
};
let fbDB = null;

function setState(txt, ok){
  const el=$('fb-state'); if(!el) return;
  el.textContent = txt;
  el.style.color = ok ? 'var(--grn)' : 'var(--txt2)';
}
async function initFirebase(){
  const { initializeApp, getDatabase, getAuth, signInAnonymously, onIdTokenChanged, ref, onValue } = window._fbImports || {};
  if(!initializeApp){ setState('接続できません（オフライン表示）', false); render(); return; }
  const app = initializeApp(FB_CONFIG, 'kyuhai-shift');
  try{
    const auth = getAuth(app);
    await new Promise(res=>{
      let done=false;
      onIdTokenChanged(auth, u=>{ if(u && !done){ done=true; res(); } });
      signInAnonymously(auth).catch(e=>console.warn('匿名認証に失敗', e));
      setTimeout(()=>{ if(!done){ done=true; res(); } }, 12000);
    });
  }catch(e){ console.warn('認証に失敗', e); }
  fbDB = getDatabase(app);
  const sub = (node, key, cb) => {
    onValue(ref(fbDB, 'nikki/'+node), snap=>{
      if(!snap.exists()) return;
      const v=snap.val();
      D[key] = Array.isArray(v) ? v : (key==='shifts' ? (v||{}) : (v ? Object.values(v) : []));
      lsSet('nikki_'+node, D[key]);
      if(cb) cb();
    }, err=>console.warn('['+node+']', err && err.message));
  };
  sub('staff_full','staff', render);
  sub('locations','locations', fillOffices);
  sub('departments','departments', fillOffices);
  sub('delivery','delivery', render);
  sub('shifts','shifts', render);
  sub('sale_events','saleEvents', render);
  setState('接続済み', true);
}
async function fbSet(node, value){
  lsSet('nikki_'+node, value);
  if(!fbDB) return false;
  const { ref, set } = window._fbImports;
  try{ await set(ref(fbDB, 'nikki/'+node), value); return true; }
  catch(e){ console.warn('保存に失敗', e); return false; }
}

// ══ シフト表 ══
const SHIFT_CODES = ['', '〇', '×', '1', '2', '3', '~1', '~2', '~3'];
const SHIFT_LABEL = {'':'', '〇':'〇', '×':'×', '1':'①', '2':'②', '3':'③', '~1':'〜①', '~2':'〜②', '~3':'〜③'};
const SHIFT_WEIGHT_DEF = {'〇':1, '×':0, '1':0.3, '2':0.2, '3':0.2, '~1':0.3, '~2':0.5, '~3':1};
const weights = () => ({...SHIFT_WEIGHT_DEF, ...(lsGet('shift_weights', null)||{})});
const shKey = (office, mon) => `${office}__${mon}`;
const shGet = (office, mon) => (D.shifts||{})[shKey(office,mon)] || {cells:{}, updatedAt:null};

function delDeptId(){
  const d=(D.departments||[]).find(x=>x && x.type==='del');
  return d ? d.id : null;
}
function delOffices(){
  const id=delDeptId();
  let locs=(D.locations||[]).filter(l=>l && l.active!==false);
  if(id!=null) locs=locs.filter(l=>!(l.deptIds||[]).length || (l.deptIds||[]).map(String).includes(String(id)));
  return locs.sort((a,b)=>(a.order||99)-(b.order||99)).map(l=>l.name);
}
function staffOf(office){
  return (D.staff||[]).filter(s=>{
    if(!s || s.status==='終了') return false;
    if(s.office===office) return true;
    return (s.subOffices||[]).some(o=>(typeof o==='string'?o:o?.name)===office);
  }).sort((a,b)=>String(a.empNo||'').localeCompare(String(b.empNo||'')));
}
// 直近6か月の平均持出（実績2か月以内・実績なしは新人80個）
function avgMochidashi(st, mon){
  const base=new Date((mon||new Date().toISOString().slice(0,7))+'-01');
  const from=new Date(base.getFullYear(), base.getMonth()-6, 1);
  const rows=(D.delivery||[]).filter(r=>{
    if(!r || r.staff!==st.name) return false;
    const d=new Date(String(r.date||'').replace(/\//g,'-')+'T00:00:00');
    return !isNaN(d) && d>=from && d<base;
  });
  if(!rows.length) return {avg:80, isNew:true};
  const months=new Set(rows.map(r=>String(r.date).slice(0,7))).size;
  if(months<=2) return {avg:80, isNew:true};
  const tot=rows.reduce((a,r)=>a+(Number(r.mochidashi)||0),0);
  const avg=Math.round(tot/rows.length);
  return {avg: avg>0?avg:80, isNew: avg<=0};
}
let _filling=false;
// ══ 第2段階：日別の予測と過不足 ══
// その営業所の日ごとの持出合計（実績）
function dailyTotals(office, fromYm, toYm){
  const map={};
  const names=new Set(staffOf(office).map(s=>s.name));
  (D.delivery||[]).forEach(r=>{
    if(!r || !names.has(r.staff)) return;
    const d=String(r.date||'').replace(/\//g,'-');
    const ym=d.slice(0,7);
    if(fromYm && ym<fromYm) return;
    if(toYm && ym>=toYm) return;
    map[d]=(map[d]||0)+(Number(r.mochidashi)||0);
  });
  return map;
}
// 曜日係数（直近6か月の実績から。実績が無ければ全曜日1）
function dowFactors(office, mon){
  const base=new Date(mon+'-01');
  const from=new Date(base.getFullYear(), base.getMonth()-6, 1).toISOString().slice(0,7);
  const map=dailyTotals(office, from, mon);
  const sum=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  Object.entries(map).forEach(([d,v])=>{
    if(!v) return;
    const dow=new Date(d+'T00:00:00').getDay();
    sum[dow]+=v; cnt[dow]++;
  });
  const avg=sum.map((s,i)=>cnt[i]?s/cnt[i]:0);
  const used=avg.filter(v=>v>0);
  if(!used.length) return {f:[1,1,1,1,1,1,1], hasData:false};
  const mean=used.reduce((a,b)=>a+b,0)/used.length;
  return {f:avg.map(v=>v>0?v/mean:0), hasData:true};
}
// 前年同月の実績合計
function lastYearTotal(office, mon){
  const [y,m]=mon.split('-').map(Number);
  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  return Object.values(map).reduce((a,b)=>a+b,0);
}
// 月合計を曜日係数で31日に割り振る
function spreadByDow(total, mon, fac, saleMap){
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const raw=[];
  let sum=0;
  for(let d=1; d<=last; d++){
    const key=`${mon}-${String(d).padStart(2,'0')}`;
    const dow=new Date(key+'T00:00:00').getDay();
    // ★ 2026-09-24.3: 曜日係数 × セール係数。最後に月合計へ正規化する
    const v=(fac[dow]||0) * ((saleMap && saleMap[key]) ? saleMap[key].factor : 1);
    raw.push(v); sum+=v;
  }
  if(!sum) return raw.map(()=>0);
  return raw.map(v=>Math.round(total*v/sum));
}
function fillOffices(){
  const sel=$('sh-off'); if(!sel || _filling) return;
  _filling=true;
  const cur=sel.value;
  const offs=delOffices();
  sel.innerHTML=offs.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if(cur && offs.includes(cur)) sel.value=cur;
  _filling=false;
  render();
}
function render(){
  const root=$('sh-root'); if(!root) return;
  if(!$('sh-mon').value) $('sh-mon').value=new Date().toISOString().slice(0,7);
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  if(!office){ root.innerHTML='<div class="al al-w">営業所がまだ読み込めていません。少し待って再読み込みしてください。</div>'; return; }
  const staff=staffOf(office);
  if(!staff.length){ root.innerHTML=`<div class="al al-w">${esc(office)} に所属する従事員が台帳にありません。</div>`; return; }
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const W='日月火水木金土';
  const data=shGet(office, mon);
  const wgt=weights();
  let head='<tr><th style="min-width:110px;">氏名</th>';
  for(let d=1; d<=last; d++){
    const dow=new Date(`${mon}-${String(d).padStart(2,'0')}T00:00:00`).getDay();
    const col=dow===0?'color:#e06666;':dow===6?'color:#6fa8dc;':'';
    head+=`<th style="${col}min-width:26px;">${d}<div class="xs" style="${col}">${W[dow]}</div></th>`;
  }
  head+='<th>休</th><th class="num">平均持出</th></tr>';
  let body='';
  staff.forEach(st=>{
    const av=avgMochidashi(st, mon);
    let off=0, tds='';
    for(let d=1; d<=last; d++){
      const key=`${st.id}|${d}`;
      const v=data.cells?.[key]||'';
      if(v==='×') off++;
      tds+=`<td class="cell" data-k="${key}" data-v="${v}" onclick="cycle(this)" style="${cellStyle(v)}">${SHIFT_LABEL[v]||''}</td>`;
    }
    body+=`<tr data-staff="${st.id}">
      <td>${esc(st.name)}<div class="xs muted mono">${esc(st.empNo||'')}</div></td>
      ${tds}
      <td class="off">${off}</td>
      <td class="num">${av.avg}${av.isNew?'<div class="xs" style="color:var(--amb)">新人</div>':''}</td>
    </tr>`;
  });
  // 予測（月合計を曜日係数で配分）
  const fc=data.forecast||{};
  const dw=dowFactors(office, mon);
  const total=Number(fc.total)||0;
  const saleMap=_saleFactorMap(mon);
  const plan=total?spreadByDow(total, mon, dw.f, saleMap):[];
  let foot='<tr><td>人数</td>';
  for(let d=1; d<=last; d++){
    let n=0;
    staff.forEach(st=>{ n += (wgt[data.cells?.[`${st.id}|${d}`]||'']||0); });
    foot+=`<td class="people" data-d="${d}">${n?Math.round(n*10)/10:''}</td>`;
  }
  foot+='<td></td><td class="num"></td></tr>';
  if(total){
    // 能力＝その日の（平均持出×重み）の合計
    const avgMap={}; staff.forEach(st=>{ avgMap[st.id]=avgMochidashi(st, mon).avg; });
    let r1='<tr><td class="num">予測（個）</td>', r2='<tr><td class="num">対応できる数</td>', r3='<tr><td class="num">過不足</td>';
    for(let d=1; d<=last; d++){
      let cap=0;
      staff.forEach(st=>{ cap += (avgMap[st.id]||0) * (wgt[data.cells?.[`${st.id}|${d}`]||'']||0); });
      cap=Math.round(cap);
      const need=plan[d-1]||0;
      const diff=cap-need;
      const col = diff<0 ? 'color:#e06666;font-weight:700;' : 'color:#6fa8dc;font-weight:700;';
      r1+=`<td class="num">${need||''}</td>`;
      r2+=`<td class="num">${cap||''}</td>`;
      r3+=`<td class="num" style="${need?col:''}">${need?(diff>0?'+':'')+diff:''}</td>`;
    }
    let r0='<tr><td class="num">セール</td>';
    for(let d=1; d<=last; d++){
      const key=`${mon}-${String(d).padStart(2,'0')}`;
      const sm=saleMap[key];
      r0+=`<td class="num" title="${sm?esc(sm.names.join('・')):''}" style="${sm?'color:#e08b1f;font-weight:700;':''}">${sm?Math.round(sm.factor*100)+'%':''}</td>`;
    }
    r0+='<td></td><td class="num"></td></tr>';
    foot+=r0;
    const sumPlan=plan.reduce((a,b)=>a+b,0);
    r1+=`<td></td><td class="num">${sumPlan}</td></tr>`;
    r2+='<td></td><td class="num"></td></tr>'; r3+='<td></td><td class="num"></td></tr>';
    foot+=r1+r2+r3;
  } else {
    // 予測が未入力でも、セールの予定だけは見えるようにする
    const smKeys=Object.keys(saleMap);
    if(smKeys.length){
      let r0='<tr><td class="num">セール</td>';
      for(let d=1; d<=last; d++){
        const key=`${mon}-${String(d).padStart(2,'0')}`;
        const sm=saleMap[key];
        r0+=`<td class="num" title="${sm?esc(sm.names.join('・')):''}" style="${sm?'color:#e08b1f;font-weight:700;':''}">${sm?Math.round(sm.factor*100)+'%':''}</td>`;
      }
      r0+='<td></td><td class="num"></td></tr>';
      foot+=r0;
    }
  }
  root.innerHTML=`
    ${total?`<div class="xs muted" style="margin-bottom:6px;">予測は月合計 ${total.toLocaleString()}個を曜日係数で配分しています${dw.hasData?'（直近6か月の実績から算出）':'（実績が足りないため全曜日を同じ比率にしています）'}。赤字は人手不足、青字は余力です。</div>`:''}
    <div class="xs muted" style="margin-bottom:6px;">
      ますをタップすると 〇 → × → ① → ② → ③ → 〜① → 〜② → 〜③ → 空 の順に変わります。<br>
      〇=終日／×=休／①②③=その便のみ／〜①〜②〜③=その便まで。人数は重み（終日1・〜②0.5・①0.3・②③0.2）で数えています。
    </div>
    <div class="tw"><table id="sh-table"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px;">
      <span class="xs muted" style="margin-right:auto;">${data.updatedAt?`最終更新 ${new Date(data.updatedAt).toLocaleString('ja-JP')}`:'未保存'}</span>
      <button class="btn gh" onclick="weekly()">曜日で一括設定</button>
      <button class="btn gh" onclick="printSheet()">印刷（数量なし）</button>
      <button class="btn grn" onclick="save()">シフトを保存</button>
    </div>`;
  refreshForecastInputs();
}
function cellStyle(v){
  if(v==='×') return 'background:rgba(128,128,128,.18);';
  if(v && v!=='〇') return 'background:rgba(224,139,31,.18);';
  return '';
}
function cycle(td){
  const i=SHIFT_CODES.indexOf(td.dataset.v||'');
  const next=SHIFT_CODES[(i+1)%SHIFT_CODES.length];
  td.dataset.v=next; td.textContent=SHIFT_LABEL[next]||'';
  td.setAttribute('style', cellStyle(next));
  recalc();
}
function recalc(){
  const wgt=weights();
  document.querySelectorAll('#sh-table tbody tr').forEach(tr=>{
    let off=0;
    tr.querySelectorAll('.cell').forEach(td=>{ if((td.dataset.v||'')==='×') off++; });
    const c=tr.querySelector('.off'); if(c) c.textContent=off;
  });
  document.querySelectorAll('#sh-table tfoot .people').forEach(td=>{
    const d=td.dataset.d; let n=0;
    document.querySelectorAll('#sh-table tbody tr').forEach(tr=>{
      const cell=tr.querySelector(`.cell[data-k$="|${d}"]`);
      if(cell) n += (wgt[cell.dataset.v||'']||0);
    });
    td.textContent = n ? Math.round(n*10)/10 : '';
  });
}
function weekly(){
  const name=prompt('どの従事員に入れますか？（氏名の一部。空欄なら全員）','');
  if(name===null) return;
  const dowStr=prompt('曜日を入力してください（例：日 または 土日）','日');
  if(dowStr===null || !dowStr.trim()) return;
  const code=prompt('入れる記号（〇 × 1 2 3 ~1 ~2 ~3）','×');
  if(code===null) return;
  const c=String(code).trim();
  if(!SHIFT_CODES.includes(c)){ alert('記号が正しくありません'); return; }
  const W='日月火水木金土';
  const dows=[...dowStr.trim()].map(ch=>W.indexOf(ch)).filter(i=>i>=0);
  if(!dows.length){ alert('曜日が読み取れません'); return; }
  const mon=_ymNorm($('sh-mon').value||'');
  document.querySelectorAll('#sh-table tbody tr').forEach(tr=>{
    const nm=tr.querySelector('td')?.textContent||'';
    if(name.trim() && !nm.includes(name.trim())) return;
    tr.querySelectorAll('.cell').forEach(td=>{
      const d=Number(String(td.dataset.k).split('|')[1]);
      const dow=new Date(`${mon}-${String(d).padStart(2,'0')}T00:00:00`).getDay();
      if(!dows.includes(dow)) return;
      td.dataset.v=c; td.textContent=SHIFT_LABEL[c]||'';
      td.setAttribute('style', cellStyle(c));
    });
  });
  recalc();
}

// ══ 第3段階：セールカレンダー ══
//   CSVの列: 日付, イベント名, 強さ(-3〜3), ずらし日数, 係数(任意), メモ(任意)
//   固定のルールは持たず、係数はいつでも手で上書きできる。
function _saleFactorMap(mon){
  const map={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const shiftDays=Number(e.shiftDays)||0;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+shiftDays);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!key.startsWith(mon)) return;
    const f = (e.factor!=null && e.factor!=='') ? Number(e.factor) : (1 + (Number(e.power)||0)*0.1);
    if(!map[key]) map[key]={factor:1, names:[]};
    map[key].factor *= (isFinite(f)&&f>0 ? f : 1);
    map[key].names.push(e.name||'セール');
  });
  return map;
}
function importSaleCsv(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const txt=String(rd.result||'').replace(/^\uFEFF/,'');
      const lines=txt.split(/\r?\n/).filter(l=>l.trim());
      if(!lines.length){ alert('CSVが空です'); return; }
      const head=lines[0].split(',').map(x=>x.trim());
      const idx=name=>head.findIndex(h=>h.replace(/\s/g,'').includes(name));
      const iDate=idx('日付')>=0?idx('日付'):0;
      const iName=idx('イベント')>=0?idx('イベント'):(idx('名')>=0?idx('名'):1);
      const iPow=idx('強')  , iShift=idx('ずら')>=0?idx('ずら'):idx('日数'), iFac=idx('係数'), iMemo=idx('メモ');
      const hasHeader = /日付|date/i.test(head[iDate]||'');
      const rows=(hasHeader?lines.slice(1):lines).map(l=>{
        const c=l.split(',').map(x=>x.trim());
        const date=String(c[iDate]||'').replace(/\//g,'-');
        if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date)) return null;
        const [y,m,d]=date.split('-').map(Number);
        return {
          date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
          name: c[iName]||'セール',
          power: iPow>=0 ? Number(c[iPow])||0 : 0,
          shiftDays: iShift>=0 ? Number(c[iShift])||0 : 0,
          factor: iFac>=0 && c[iFac]!=='' ? Number(c[iFac]) : null,
          memo: iMemo>=0 ? (c[iMemo]||'') : '',
        };
      }).filter(Boolean);
      if(!rows.length){ alert('読み取れる行がありませんでした。1列目に日付（2026-10-05 など）を入れてください。'); return; }
      const keep=(D.saleEvents||[]).filter(e=>!rows.some(r=>r.date===e.date && r.name===e.name));
      D.saleEvents=[...keep, ...rows].sort((a,b)=>a.date.localeCompare(b.date));
      const ok=await fbSet('sale_events', D.saleEvents);
      render();
      alert(`${rows.length}件を読み込みました${ok?'':'（サーバーへの保存に失敗しました）'}`);
    }catch(e){ console.error(e); alert('CSVの読み込みに失敗しました'); }
    input.value='';
  };
  rd.readAsText(file, 'utf-8');
}
// 前年の同じ日付で、平常日と比べて何%だったかを出す
function checkLastYear(){
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  const evs=(D.saleEvents||[]).filter(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return false;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===mon;
  });
  if(!evs.length){ alert('この月に当たるセールの予定がありません。CSVを読み込んでください。'); return; }
  const [y,m]=mon.split('-').map(Number);
  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  const vals=Object.values(map).filter(v=>v>0);
  if(!vals.length){ alert('前年同月の実績がないため、答え合わせができません。'); return; }
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const lines=evs.map(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    const lyd=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const v=map[lyd]||0;
    const pct=v?Math.round(v/mean*100):null;
    const fac=(e.factor!=null&&e.factor!=='')?Number(e.factor):(1+(Number(e.power)||0)*0.1);
    return `${lyd}　${e.name}　前年 ${v?v.toLocaleString()+'個（平常比 '+pct+'%）':'実績なし'}　いまの係数 ${Math.round(fac*100)}%`;
  });
  alert(`前年同月の平常平均 ${Math.round(mean).toLocaleString()}個／日\n\n`+lines.join('\n')
    + '\n\n係数がずれている場合は、CSVの「係数」列か「強さ」列を直して読み込み直してください。');
}
