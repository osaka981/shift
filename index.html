<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪急配 シフト表</title>
<style>
  :root{
    --bg:#10141a; --bg2:#161b23; --bg3:#1d232d; --brd:#2b333f; --brd2:#39424f;
    --txt:#e8edf4; --txt2:#97a3b4; --accent:#2f80ed; --grn:#009c5a; --amb:#e08b1f; --red:#d9534f;
    --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root:not([data-theme="dark"]){ }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6f9; --bg2:#fff; --bg3:#eef1f6; --brd:#d8dee8; --brd2:#c3ccd9;
      --txt:#1b2430; --txt2:#5d6b7d;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
  h1{font-size:15px;margin:0;font-weight:700;}
  .ver{font-family:var(--mono);font-size:10px;color:var(--txt2);}
  .wrap{padding:12px 14px 40px;max-width:100%;}
  .card{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:12px;}
  .fi{background:var(--bg3);border:1px solid var(--brd2);border-radius:5px;padding:6px 9px;color:var(--txt);
    font-family:inherit;font-size:12px;outline:none;max-width:100%;}
  .btn{border:1px solid var(--brd2);background:var(--bg3);color:var(--txt);border-radius:6px;
    padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.grn{background:var(--grn);border-color:var(--grn);color:#fff;}
  .btn.gh{background:transparent;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--txt2);}
  .xs{font-size:10.5px;}
  .tw{overflow:auto;max-height:64vh;border:1px solid var(--brd);border-radius:6px;}
  table{border-collapse:collapse;font-size:11px;width:100%;}
  th,td{border:1px solid var(--brd);padding:3px 4px;text-align:center;white-space:nowrap;}
  thead th{position:sticky;top:0;background:var(--bg3);z-index:2;}
  tbody td:first-child,thead th:first-child{position:sticky;left:0;background:var(--bg2);text-align:left;z-index:1;}
  tfoot td{background:var(--bg3);font-weight:700;}
  .cell{cursor:pointer;user-select:none;}
  .al{border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:10px;}
  .al-w{background:rgba(224,139,31,.12);border:1px solid rgba(224,139,31,.4);}
  .al-e{background:rgba(217,83,79,.12);border:1px solid rgba(217,83,79,.4);}
  .mono{font-family:var(--mono);}
  /* ★ 2026-09-24.8: スマホ表示 */
  @media (max-width: 720px){
    header{padding:8px 10px;gap:6px;position:static;}
    h1{font-size:13px;}
    .wrap{padding:8px 8px 60px;}
    .card{padding:8px;margin-bottom:8px;}
    .btn{padding:8px 10px;font-size:12px;}
    .fi{font-size:12px;padding:7px 8px;}
    #off-tabs, #view-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    #off-tabs .btn, #view-tabs .btn{white-space:nowrap;flex:0 0 auto;}
    .tw{max-height:70vh;}
    table{font-size:10.5px;}
    th,td{padding:2px 3px;}
    thead th{font-size:9.5px;}
    /* 1列目（氏名・項目）を固定したまま、横スクロールで日付を送る */
    tbody td:first-child,thead th:first-child,tfoot td:first-child{min-width:86px;max-width:110px;white-space:normal;}
    .cell{min-width:26px;}
    #cs-map{height:300px;}
    /* 予測の入力欄は縦に積む */
    #fc-card .row{gap:6px;}
    #fc-card .row > div{flex:1 1 46%;}
  }
  @media (max-width: 420px){
    table{font-size:10px;}
    .cell{min-width:24px;}
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<body>
<header>
  <div>
    <h1>大阪急配　シフト表</h1>
    <div class="ver" id="app-ver">ver 2026-09-24.9</div>
  </div>
  <div class="row" style="margin-left:auto;">
    <select id="sh-off" class="fi" style="display:none;"></select>
    <input type="month" id="sh-mon" class="fi">
    <span id="fb-state" class="xs muted">接続中…</span>
  </div>
  <div class="row" id="off-tabs" style="flex-basis:100%;gap:4px;"></div>
  <div class="row" id="view-tabs" style="flex-basis:100%;gap:4px;">
    <button class="btn" id="vt-shift" onclick="setView('shift')">シフト表</button>
    <button class="btn gh" id="vt-course" onclick="setView('course')">集荷コース</button>
  </div>
</header>

<div class="wrap">
  <div class="card" id="fc-card">
    <div class="row" style="align-items:flex-end;">
      <div>
        <div class="xs muted">月の予測合計（持出）</div>
        <input type="number" id="fc-total" class="fi" style="width:110px;" placeholder="例 21000">
      </div>
      <div>
        <div class="xs muted">昨対（%）</div>
        <input type="number" id="fc-yoy" class="fi" style="width:80px;" placeholder="例 105">
      </div>
      <div class="xs muted" id="fc-ly"></div>
      <button class="btn gh" onclick="applyYoy()">昨対から計算</button>
      <button class="btn grn" onclick="saveForecast()">予測を保存</button>
      <label class="btn gh" style="display:inline-block;">セールCSVを読み込む
        <input type="file" id="fc-csv" accept=".csv,text/csv" style="display:none;" onchange="importSaleCsv(this)">
      </label>
      <button class="btn gh" onclick="checkLastYear()">前年で答え合わせ</button>
      <span class="xs muted" id="fc-note" style="flex-basis:100%;"></span>
    </div>
  </div>
  <div id="shift-wrap">
    <div class="card">
      <div id="sh-root"><div class="al al-w">読み込み中です…</div></div>
    </div>
  </div>
  <div id="course-wrap" style="display:none;">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <select id="cs-sel" class="fi" onchange="renderCourse()"></select>
          <button class="btn gh" onclick="newCourse()">＋コースを追加</button>
          <button class="btn gh" onclick="delCourse()">削除</button>
        </div>
        <div class="row xs muted">
          平均速度 <input type="number" id="cs-speed" class="fi" style="width:60px;" value="25" onchange="renderCourse()"> km/h
          　店入れ <input type="number" id="cs-work" class="fi" style="width:55px;" value="10" onchange="renderCourse()"> 分
          　持込 <input type="number" id="cs-post-work" class="fi" style="width:55px;" value="20" onchange="renderCourse()"> 分
        </div>
      </div>
    </div>
    <div class="card"><div id="cs-root"></div></div>
    <div class="card"><div id="cs-map" style="height:420px;border-radius:6px;"></div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously, onIdTokenChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
window._fbImports = { initializeApp, getDatabase, ref, set, onValue, getAuth, signInAnonymously, onIdTokenChanged };
document.dispatchEvent(new Event('fb-sdk-ready'));

<script>
'use strict';
const APP_VER = '2026-09-24.9';
console.log('[シフト表] APP_VER', APP_VER);

const FB_CONFIG = {
  apiKey: "AIzaSyDDsNZnlG3swyRtuCbMjkUkZpH4X68gUiI",
  authDomain: "osq-report-3db91.firebaseapp.com",
  databaseURL: "https://osq-report-3db91-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "osq-report-3db91",
  storageBucket: "osq-report-3db91.firebasestorage.app",
  messagingSenderId: "86627546503",
  appId: "1:86627546503:web:62d338fb75ebaa91bbcf22"
};

const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const _ymNorm = v => String(v||'').replace(/\//g,'-').slice(0,7);

// ── データ（経営管理と同じFirebaseを見る） ──
const D = {
  staff: lsGet('nikki_staff_full', []) || [],
  locations: lsGet('nikki_locations', []) || [],
  departments: lsGet('nikki_departments', []) || [],
  delivery: lsGet('nikki_delivery', []) || [],
  shifts: lsGet('nikki_shifts', {}) || {},
  settings: lsGet('nikki_shift_settings', {}) || {},
  customers: lsGet('nikki_customers', []) || [],
  offices: lsGet('nikki_offices', []) || [],
  courses: lsGet('nikki_col_courses', []) || [],
  saleEvents: lsGet('nikki_sale_events', []) || [],   // ★ 2026-09-24.3: セールカレンダー
};
let fbDB = null;

function setState(txt, ok){
  const el=$('fb-state'); if(!el) return;
  el.textContent = txt;
  el.style.color = ok ? 'var(--grn)' : 'var(--txt2)';
}
async function initFirebase(){
  const { initializeApp, getDatabase, getAuth, signInAnonymously, onIdTokenChanged, ref, onValue } = window._fbImports || {};
  if(!initializeApp){ setState('接続できません（オフライン表示）', false); render(); return; }
  const app = initializeApp(FB_CONFIG, 'kyuhai-shift');
  try{
    const auth = getAuth(app);
    await new Promise(res=>{
      let done=false;
      onIdTokenChanged(auth, u=>{ if(u && !done){ done=true; res(); } });
      signInAnonymously(auth).catch(e=>console.warn('匿名認証に失敗', e));
      setTimeout(()=>{ if(!done){ done=true; res(); } }, 12000);
    });
  }catch(e){ console.warn('認証に失敗', e); }
  fbDB = getDatabase(app);
  const sub = (node, key, cb) => {
    onValue(ref(fbDB, 'nikki/'+node), snap=>{
      if(!snap.exists()) return;
      const v=snap.val();
      D[key] = Array.isArray(v) ? v : (key==='shifts' ? (v||{}) : (v ? Object.values(v) : []));
      lsSet('nikki_'+node, D[key]);
      if(cb) cb();
    }, err=>console.warn('['+node+']', err && err.message));
  };
  sub('staff_full','staff', render);
  sub('locations','locations', fillOffices);
  sub('departments','departments', fillOffices);
  sub('delivery','delivery', render);
  sub('shifts','shifts', render);
  sub('sale_events','saleEvents', render);
  sub('customers','customers', ()=>{ if(_view==='course') renderCourse(); });
  sub('offices','offices', ()=>{ if(_view==='course') renderCourse(); });
  sub('col_courses','courses', ()=>{ if(_view==='course') renderCourse(); });
  onValue(ref(fbDB,'nikki/shift_settings'), snap=>{
    if(!snap.exists()) return;
    D.settings=snap.val()||{};
    lsSet('nikki_shift_settings', D.settings);
    render();
  }, err=>console.warn('[shift_settings]', err && err.message));
  setState('接続済み', true);
}
async function fbSet(node, value){
  lsSet('nikki_'+node, value);
  if(!fbDB) return false;
  const { ref, set } = window._fbImports;
  try{ await set(ref(fbDB, 'nikki/'+node), value); return true; }
  catch(e){ console.warn('保存に失敗', e); return false; }
}

// ══ シフト表 ══
const SHIFT_CODES = ['', '〇', '×', '1', '2', '3', '~1', '~2', '~3'];
const SHIFT_LABEL = {'':'', '〇':'〇', '×':'×', '1':'①', '2':'②', '3':'③', '~1':'〜①', '~2':'〜②', '~3':'〜③'};
// ★ 2026-09-24.7: 終日1として各便0.3ずつ。〜③は終日と同じ1
const SHIFT_WEIGHT_DEF = {'〇':1, '×':0, '1':0.3, '2':0.3, '3':0.3, '~1':0.3, '~2':0.6, '~3':1};
const weights = () => ({...SHIFT_WEIGHT_DEF, ...(D.settings?.weights||{})});
async function saveWeights(){
  const w={};
  ['〇','1','2','3','~1','~2','~3'].forEach(k=>{
    const el=document.querySelector(`.wgt-in[data-k="${k}"]`);
    if(el) w[k]=Number(el.value)||0;
  });
  D.settings={...(D.settings||{}), weights:w};
  const ok=await fbSet('shift_settings', D.settings);
  render();
  if(!ok) alert('端末には保存しましたが、サーバーへの保存に失敗しました。');
}
function cellWeight(v, wgt){
  if(!v) return 0;
  if(String(v).startsWith('C:')) return 1;   // コースは1人分
  return wgt[v]||0;
}
const shKey = (office, mon) => `${office}__${mon}`;
const shGet = (office, mon) => (D.shifts||{})[shKey(office,mon)] || {cells:{}, updatedAt:null};

function delDeptId(){
  const d=(D.departments||[]).find(x=>x && x.type==='del');
  return d ? d.id : null;
}
function delOffices(){
  const id=delDeptId();
  let locs=(D.locations||[]).filter(l=>l && l.active!==false);
  if(id!=null) locs=locs.filter(l=>!(l.deptIds||[]).length || (l.deptIds||[]).map(String).includes(String(id)));
  return locs.sort((a,b)=>(a.order||99)-(b.order||99)).map(l=>l.name);
}
// ★ 2026-09-24.5: 集荷の拠点か（部署マスタの集荷事業部が付いている拠点）
// ★ 2026-09-24.5: セルのキーは社員番号。日報アプリ側も社員番号で見るため。
//   以前保存した「従業員IDのキー」も読み込めるようにする。
function cellKeyOf(st, d){ return `${st.empNo||st.id}|${d}`; }
function cellGet(cells, st, d){
  if(!cells) return '';
  return cells[cellKeyOf(st,d)] ?? cells[`${st.id}|${d}`] ?? '';
}
function isColOffice(name){
  const dep=(D.departments||[]).find(x=>x && x.type==='col');
  if(!dep) return false;
  const loc=(D.locations||[]).find(l=>l && l.name===name);
  return !!loc && (loc.deptIds||[]).map(String).includes(String(dep.id));
}
function courseById(id){ return (D.courses||[]).find(c=>String(c.id)===String(id)) || null; }
// セルの表示（集荷拠点はコース名、宅配は記号）
function cellLabel(office, v){
  if(!v) return '';
  if(v==='×') return '×';
  if(String(v).startsWith('C:')){
    const c=courseById(String(v).slice(2));
    return c ? esc(c.name.replace(/コース$/,'')) : '?';
  }
  return SHIFT_LABEL[v]||'';
}
function staffOf(office){
  return (D.staff||[]).filter(s=>{
    if(!s || s.status==='終了') return false;
    if(s.office===office) return true;
    return (s.subOffices||[]).some(o=>(typeof o==='string'?o:o?.name)===office);
  }).sort((a,b)=>String(a.empNo||'').localeCompare(String(b.empNo||'')));
}
// 直近6か月の平均持出（実績2か月以内・実績なしは新人80個）
function avgMochidashi(st, mon){
  const base=new Date((mon||new Date().toISOString().slice(0,7))+'-01');
  const from=new Date(base.getFullYear(), base.getMonth()-6, 1);
  const rows=(D.delivery||[]).filter(r=>{
    if(!r || r.staff!==st.name) return false;
    const d=new Date(String(r.date||'').replace(/\//g,'-')+'T00:00:00');
    return !isNaN(d) && d>=from && d<base;
  });
  if(!rows.length) return {avg:80, isNew:true};
  const months=new Set(rows.map(r=>String(r.date).slice(0,7))).size;
  if(months<=2) return {avg:80, isNew:true};
  const tot=rows.reduce((a,r)=>a+(Number(r.mochidashi)||0),0);
  const avg=Math.round(tot/rows.length);
  return {avg: avg>0?avg:80, isNew: avg<=0};
}
let _filling=false;
// ══ 第2段階：日別の予測と過不足 ══
// その営業所の日ごとの持出合計（実績）
function dailyTotals(office, fromYm, toYm){
  const map={};
  const names=new Set(staffOf(office).map(s=>s.name));
  (D.delivery||[]).forEach(r=>{
    if(!r || !names.has(r.staff)) return;
    const d=String(r.date||'').replace(/\//g,'-');
    const ym=d.slice(0,7);
    if(fromYm && ym<fromYm) return;
    if(toYm && ym>=toYm) return;
    map[d]=(map[d]||0)+(Number(r.mochidashi)||0);
  });
  return map;
}
// 曜日係数（直近6か月の実績から。実績が無ければ全曜日1）
function dowFactors(office, mon){
  const base=new Date(mon+'-01');
  const from=new Date(base.getFullYear(), base.getMonth()-6, 1).toISOString().slice(0,7);
  const map=dailyTotals(office, from, mon);
  const sum=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  Object.entries(map).forEach(([d,v])=>{
    if(!v) return;
    const dow=new Date(d+'T00:00:00').getDay();
    sum[dow]+=v; cnt[dow]++;
  });
  const avg=sum.map((s,i)=>cnt[i]?s/cnt[i]:0);
  const used=avg.filter(v=>v>0);
  if(!used.length) return {f:[1,1,1,1,1,1,1], hasData:false};
  const mean=used.reduce((a,b)=>a+b,0)/used.length;
  return {f:avg.map(v=>v>0?v/mean:0), hasData:true};
}
// 前年同月の実績合計
function lastYearTotal(office, mon){
  const [y,m]=mon.split('-').map(Number);
  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  return Object.values(map).reduce((a,b)=>a+b,0);
}
// 月合計を曜日係数で31日に割り振る
function spreadByDow(total, mon, fac, saleMap){
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const raw=[];
  let sum=0;
  for(let d=1; d<=last; d++){
    const key=`${mon}-${String(d).padStart(2,'0')}`;
    const dow=new Date(key+'T00:00:00').getDay();
    // ★ 2026-09-24.3: 曜日係数 × セール係数。最後に月合計へ正規化する
    const v=(fac[dow]||0) * ((saleMap && saleMap[key]) ? saleMap[key].factor : 1);
    raw.push(v); sum+=v;
  }
  if(!sum) return raw.map(()=>0);
  return raw.map(v=>Math.round(total*v/sum));
}
function fillOffices(){
  const sel=$('sh-off'); if(!sel || _filling) return;
  _filling=true;
  const cur=sel.value;
  const offs=delOffices();
  sel.innerHTML=offs.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if(cur && offs.includes(cur)) sel.value=cur;
  _filling=false;
  renderOffTabs();
  render();
}
function render(){
  const root=$('sh-root'); if(!root) return;
  if(!$('sh-mon').value) $('sh-mon').value=new Date().toISOString().slice(0,7);
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  if(!office){ root.innerHTML='<div class="al al-w">営業所がまだ読み込めていません。少し待って再読み込みしてください。</div>'; return; }
  const staff=staffOf(office);
  if(!staff.length){ root.innerHTML=`<div class="al al-w">${esc(office)} に所属する従事員が台帳にありません。</div>`; return; }
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const W='日月火水木金土';
  const data=shGet(office, mon);
  const wgt=weights();
  const colMode=isColOffice(office);   // ★ 2026-09-24.5: 集荷はコース名を入れる
  let head='<tr><th style="min-width:110px;">氏名</th>';
  for(let d=1; d<=last; d++){
    const dow=new Date(`${mon}-${String(d).padStart(2,'0')}T00:00:00`).getDay();
    const col=dow===0?'color:#e06666;':dow===6?'color:#6fa8dc;':'';
    head+=`<th style="${col}min-width:26px;">${d}<div class="xs" style="${col}">${W[dow]}</div></th>`;
  }
  head+='<th>休</th><th class="num">平均持出</th></tr>';
  let body='';
  staff.forEach(st=>{
    const av=avgMochidashi(st, mon);
    let off=0, tds='';
    for(let d=1; d<=last; d++){
      const key=cellKeyOf(st, d);
      const v=cellGet(data.cells, st, d);
      if(v==='×') off++;

function pickCourse(td){
  const office=$('sh-off').value||'';
  const list=(D.courses||[]).filter(c=>!c.office || c.office===office);
  if(!list.length){ alert('コースがありません。「集荷コース」で作ってください。'); return; }
  const cur=td.dataset.v||'';
  const menu=['（空にする）','休み（×）',...list.map(c=>c.name)];
  const pick=prompt(`この日の担当を選んでください（番号）\n`+menu.map((m,i)=>`${i}: ${m}`).join('\n'), '0');
  if(pick===null) return;
  const i=Number(pick);
  if(!Number.isInteger(i) || i<0 || i>=menu.length) return;

  td.setAttribute('style', cellStyle(v));
  recalc();

function cycle(td){
  const i=SHIFT_CODES.indexOf(td.dataset.v||'');
  const next=SHIFT_CODES[(i+1)%SHIFT_CODES.length];
  td.dataset.v=next; td.textContent=SHIFT_LABEL[next]||'';
  td.setAttribute('style', cellStyle(next));
  recalc();
}
function recalc(){
  const wgt=weights();
  document.querySelectorAll('#sh-table tbody tr').forEach(tr=>{
    let off=0;
    tr.querySelectorAll('.cell').forEach(td=>{ if((td.dataset.v||'')==='×') off++; });
    const c=tr.querySelector('.off'); if(c) c.textContent=off;
  });
  document.querySelectorAll('#sh-table tfoot .people').forEach(td=>{
    const d=td.dataset.d; let n=0;
    document.querySelectorAll('#sh-table tbody tr').forEach(tr=>{
      const cell=tr.querySelector(`.cell[data-k$="|${d}"]`);
      if(cell) n += cellWeight(cell.dataset.v||'', wgt);
    });
    td.textContent = n ? Math.round(n*10)/10 : '';
  });
}

// ══ 第3段階：セールカレンダー ══
//   CSVの列: 日付, イベント名, 強さ(-3〜3), ずらし日数, 係数(任意), メモ(任意)
//   固定のルールは持たず、係数はいつでも手で上書きできる。
function _saleFactorMap(mon){
  const map={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const shiftDays=Number(e.shiftDays)||0;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+shiftDays);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!key.startsWith(mon)) return;
    const f = (e.factor!=null && e.factor!=='') ? Number(e.factor) : (1 + (Number(e.power)||0)*0.1);
    if(!map[key]) map[key]={factor:1, names:[], items:[]};
    map[key].factor *= (isFinite(f)&&f>0 ? f : 1);
    const label = [e.media, e.name].filter(Boolean).join(' ') || 'セール';
    map[key].names.push(label);
    map[key].items.push({label, factor:(isFinite(f)&&f>0?f:1), src:e});
  });
  return map;
}
function importSaleCsv(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const txt=String(rd.result||'').replace(/^\uFEFF/,'');
      const lines=txt.split(/\r?\n/).filter(l=>l.trim());
      if(!lines.length){ alert('CSVが空です'); return; }
      const head=lines[0].split(',').map(x=>x.trim());
      const idx=name=>head.findIndex(h=>h.replace(/\s/g,'').includes(name));
      const iDate=idx('日付')>=0?idx('日付'):0;
      const iName=idx('イベント')>=0?idx('イベント'):(idx('名')>=0?idx('名'):1);
      const iPow=idx('強')  , iShift=idx('ずら')>=0?idx('ずら'):idx('日数'), iFac=idx('係数'), iMemo=idx('メモ');
      const iMedia=idx('媒体')>=0?idx('媒体'):(idx('サイト')>=0?idx('サイト'):(idx('通販')>=0?idx('通販'):-1));
      const hasHeader = /日付|date/i.test(head[iDate]||'');
      const rows=(hasHeader?lines.slice(1):lines).map(l=>{
        const c=l.split(',').map(x=>x.trim());
        const date=String(c[iDate]||'').replace(/\//g,'-');
        if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date)) return null;
        const [y,m,d]=date.split('-').map(Number);
        return {
          date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
          media: iMedia>=0 ? (c[iMedia]||'') : '',
          name: c[iName]||'セール',
          power: iPow>=0 ? Number(c[iPow])||0 : 0,
          shiftDays: iShift>=0 ? Number(c[iShift])||0 : 0,
          factor: iFac>=0 && c[iFac]!=='' ? Number(c[iFac]) : null,
          memo: iMemo>=0 ? (c[iMemo]||'') : '',
        };
      }).filter(Boolean);
      if(!rows.length){ alert('読み取れる行がありませんでした。1列目に日付（2026-10-05 など）を入れてください。'); return; }
      const keep=(D.saleEvents||[]).filter(e=>!rows.some(r=>r.date===e.date && r.name===e.name && (r.media||'')===(e.media||'')));
      D.saleEvents=[...keep, ...rows].sort((a,b)=>a.date.localeCompare(b.date));
      const ok=await fbSet('sale_events', D.saleEvents);
      render();
      alert(`${rows.length}件を読み込みました${ok?'':'（サーバーへの保存に失敗しました）'}`);
    }catch(e){ console.error(e); alert('CSVの読み込みに失敗しました'); }
    input.value='';
  };
  rd.readAsText(file, 'utf-8');
}
// 前年の同じ日付で、平常日と比べて何%だったかを出す
function checkLastYear(){
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  const evs=(D.saleEvents||[]).filter(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return false;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===mon;
  });
  if(!evs.length){ alert('この月に当たるセールの予定がありません。CSVを読み込んでください。'); return; }
  const [y,m]=mon.split('-').map(Number);
  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  const vals=Object.values(map).filter(v=>v>0);
  if(!vals.length){ alert('前年同月の実績がないため、答え合わせができません。'); return; }
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const lines=evs.map(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    const lyd=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const v=map[lyd]||0;
    const pct=v?Math.round(v/mean*100):null;
    const fac=(e.factor!=null&&e.factor!=='')?Number(e.factor):(1+(Number(e.power)||0)*0.1);
    return `${lyd}　${e.name}　前年 ${v?v.toLocaleString()+'個（平常比 '+pct+'%）':'実績なし'}　いまの係数 ${Math.round(fac*100)}%`;
  });
  alert(`前年同月の平常平均 ${Math.round(mean).toLocaleString()}個／日\n\n`+lines.join('\n')
    + '\n\n係数がずれている場合は、CSVの「係数」列か「強さ」列を直して読み込み直してください。');
}

  if(!ok) alert('端末には保存しましたが、サーバーへの保存に失敗しました。通信を確認してください。');
}

// ══════════════════════════════════════════════════
//  ★ 2026-09-24.4: 集荷コース（配車）
//   コースは人と切り離した箱。立ち寄り順・指定時刻・郵便局持込を持ち、
//   直線距離×1.3を道のりの目安として所要時間を積み上げる。
// ══════════════════════════════════════════════════
let _view='shift';
let _csMap=null, _csLayer=null;
function setView(v){
  _view=v;
  $('shift-wrap').style.display = v==='shift' ? '' : 'none';
  $('course-wrap').style.display = v==='course' ? '' : 'none';
  $('vt-shift').className = v==='shift' ? 'btn' : 'btn gh';
  $('vt-course').className = v==='course' ? 'btn' : 'btn gh';
  if(v==='course') renderCourse(); else render();
}
function renderOffTabs(){
  const box=$('off-tabs'); if(!box) return;
  const offs=delOffices();
  const cols=(D.locations||[]).filter(l=>l && l.active!==false && !offs.includes(l.name)).map(l=>l.name);
  const all=[...offs, ...cols];
  const cur=$('sh-off').value || all[0] || '';
  if($('sh-off') && !$('sh-off').value && cur) $('sh-off').value=cur;
  box.innerHTML = all.map(n=>`<button class="btn ${n===cur?'':'gh'}" onclick="pickOffice('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`).join('');
}
function pickOffice(name){
  const sel=$('sh-off');
  if(sel && ![...sel.options].some(o=>o.value===name)){
    const op=document.createElement('option'); op.value=name; op.textContent=name; sel.appendChild(op);
  }
  if(sel) sel.value=name;
  renderOffTabs();
  if(_view==='course') renderCourse(); else render();
}
// ── コースのデータ ──
function courses(){ return (D.courses||[]).filter(c=>c && (!c.office || c.office===($('sh-off').value||''))); }
function curCourse(){
  const id=$('cs-sel')?.value||'';
  return (D.courses||[]).find(c=>String(c.id)===String(id)) || null;
}
async function saveCourses(){
  const ok=await fbSet('col_courses', D.courses||[]);
  if(!ok) alert('端末には保存しましたが、サーバーへの保存に失敗しました。');
}
async function newCourse(){
  const name=prompt('コース名（例：都島コース）','');
  if(name===null || !name.trim()) return;
  const c={ id:Date.now(), office:$('sh-off').value||'', name:name.trim(),
    depart:'10:00', stops:[], post:null, updatedAt:new Date().toISOString() };
  D.courses=[...(D.courses||[]), c];
  await saveCourses();
  renderCourse(c.id);
}
async function delCourse(){
  const c=curCourse(); if(!c) return;
  if(!confirm(`${c.name} を削除しますか？`)) return;
  D.courses=(D.courses||[]).filter(x=>String(x.id)!==String(c.id));
  await saveCourses();
  renderCourse();
}
// ── 距離・時間 ──
function distKm(a, b){
  if(!a || !b || !a.lat || !b.lat) return 0;
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const ROAD_RATIO = 1.3;   // 直線距離 → 道のりの目安
function hm2min(v){ const [h,m]=String(v||'0:00').split(':').map(Number); return (h||0)*60+(m||0); }
function min2hm(v){ v=Math.max(0,Math.round(v)); return `${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`; }
function custPos(id){
  const c=(D.customers||[]).find(x=>String(x.id)===String(id));
  if(!c) return null;
  return {lat:Number(c.lat)||0, lng:Number(c.lng)||0, name:c.name, addr:(c.puSameAsAddr===false&&c.puAddr)?c.puAddr:(c.addr||'')};
}
function officePos(name){
  const o=(D.offices||[]).find(x=>x && x.name===name);
  if(!o) return null;
  return {lat:Number(o.lat)||0, lng:Number(o.lng)||0, name:o.name, addr:o.addr||''};
}
// コースの時間を積み上げる
function calcCourse(c){
  const speed=Number($('cs-speed')?.value)||25;
  const workDef=Number($('cs-work')?.value)||10;
  const postWork=Number($('cs-post-work')?.value)||20;
  const start=officePos($('sh-off').value||'') || null;
  let t=hm2min(c.depart||'10:00');
  let prev=start, km=0;
  const rows=[];
  (c.stops||[]).forEach(st=>{
    const p=custPos(st.custId);
    const d=(prev&&p)?distKm(prev,p)*ROAD_RATIO:0;
    km+=d;
    const move=speed>0?Math.round(d/speed*60):0;
    t+=move;
    let wait=0;
    if(st.at){ const want=hm2min(st.at); if(want>t){ wait=want-t; t=want; } }
    const arrive=t;
    const work=Number(st.work)||workDef;
    t+=work;
    rows.push({name:p?p.name:'(位置なし)', arrive:min2hm(arrive), leave:min2hm(t),
      move, wait, work, km:d, at:st.at||'', noPos:!p||!p.lat});
    if(p&&p.lat) prev=p;
  });
  if(c.post){
    const p=officePos(c.post);
    const d=(prev&&p)?distKm(prev,p)*ROAD_RATIO:0;
    km+=d;
    const move=speed>0?Math.round(d/speed*60):0;
    t+=move;
    const arrive=t;
    t+=postWork;
    rows.push({name:`${c.post}（持込）`, arrive:min2hm(arrive), leave:min2hm(t),
      move, wait:0, work:postWork, km:d, at:'', post:true, noPos:!p||!p.lat});
    if(p&&p.lat) prev=p;
  }
  // 営業所へ戻る
  if(start && prev && prev!==start){
    const d=distKm(prev,start)*ROAD_RATIO; km+=d;
    const move=speed>0?Math.round(d/speed*60):0;
    t+=move;
    rows.push({name:`${start.name}（帰社）`, arrive:min2hm(t), leave:'', move, wait:0, work:0, km:d, back:true});
  }
  return {rows, endMin:t, km, totalMin:t-hm2min(c.depart||'10:00')};
}
function renderCourse(selId){
  renderOffTabs();
  const sel=$('cs-sel'); if(!sel) return;
  const list=courses();
  const cur=selId!=null?String(selId):(sel.value||'');
  sel.innerHTML = list.length ? list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')
    : '<option value="">（コースなし）</option>';
  if(cur && list.some(c=>String(c.id)===cur)) sel.value=cur;
  const c=curCourse();
  const root=$('cs-root');
  if(!c){ root.innerHTML='<div class="al al-w">「＋コースを追加」でコースを作ってください。</div>'; drawMap(null); return; }
  const r=calcCourse(c);
  // ★ 2026-09-24.7: 営業所の位置が無いと、1件目までの移動が0分になる
  const startPos=officePos($('sh-off').value||'');
  const startWarn = (!startPos || !startPos.lat)
    ? `<div class="al al-e" style="margin-bottom:8px;">${esc($('sh-off').value||'営業所')}の位置が未設定です。営業所から1件目までの移動時間が0分で計算されています。経営管理の郵便局一覧でこの営業所を開き、所在地から位置を取得してください。</div>` : '';
  const opts=(D.customers||[]).slice().sort((a,b)=>String(a.custNo||'').localeCompare(String(b.custNo||'')))
    .map(x=>`<option value="${x.id}">${esc(x.custNo||'')} ${esc(x.name)}</option>`).join('');
  const offOpts=(D.offices||[]).map(o=>`<option value="${esc(o.name)}"${c.post===o.name?' selected':''}>${esc(o.name)}</option>`).join('');
  root.innerHTML=startWarn+`
    <div class="row" style="margin-bottom:8px;">
      <span class="xs muted">出勤（出発）</span>
      <input type="time" id="cs-depart" class="fi" value="${esc(c.depart||'10:00')}" onchange="setDepart(this.value)">
      <span class="xs muted">郵便局持込</span>
      <select id="cs-post" class="fi" onchange="setPost(this.value)">
        <option value="">なし（店入れのみ）</option>${offOpts}
      </select>
      <span class="xs muted">所要 <b>${Math.floor(r.totalMin/60)}時間${String(r.totalMin%60).padStart(2,'0')}分</b>　終了 <b>${min2hm(r.endMin)}</b>　走行 約${r.km.toFixed(1)}km</span>
    </div>
    <div class="tw" style="max-height:none;"><table>
      <thead><tr><th>順</th><th>立ち寄り先</th><th>指定</th><th>到着</th><th>出発</th><th>移動</th><th>待ち</th><th>作業</th><th>距離</th><th></th></tr></thead>
      <tbody>
        <tr style="background:var(--bg3);">
          <td></td><td style="text-align:left;">${esc(startPos?startPos.name:'営業所')}（出発）</td><td></td>
          <td class="mono">${esc(c.depart||'')}</td><td class="mono">${esc(c.depart||'')}</td>
          <td></td><td></td><td></td><td></td><td></td>
        </tr>
        ${(c.stops||[]).map((st,i)=>{
        const row=r.rows[i]||{};
        return `<tr>
          <td>${i+1}</td>
          <td style="text-align:left;">${esc(row.name||'')}${row.noPos?'<span class="xs" style="color:#e06666;">（位置未設定）</span>':''}</td>
          <td><input type="time" class="fi" style="width:96px;" value="${esc(st.at||'')}" onchange="setStop(${i},'at',this.value)"></td>
          <td class="mono">${esc(row.arrive||'')}</td>
          <td class="mono">${esc(row.leave||'')}</td>
          <td class="mono xs">${row.move||0}分</td>
          <td class="mono xs" style="${row.wait?'color:#e08b1f;':''}">${row.wait?row.wait+'分':''}</td>
          <td><input type="number" class="fi" style="width:60px;" value="${st.work!=null?st.work:''}" placeholder="${Number($('cs-work')?.value)||10}" onchange="setStop(${i},'work',this.value)"></td>
          <td class="mono xs">${(row.km||0).toFixed(1)}km</td>
          <td>
            <button class="btn gh" style="padding:2px 6px;font-size:10px;" onclick="moveStop(${i},-1)">↑</button>
            <button class="btn gh" style="padding:2px 6px;font-size:10px;" onclick="moveStop(${i},1)">↓</button>
            <button class="btn gh" style="padding:2px 6px;font-size:10px;" onclick="pickOnMap(${st.custId})" title="地図をクリックして位置を決める">位置</button>
            <button class="btn gh" style="padding:2px 6px;font-size:10px;" onclick="delStop(${i})">×</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
      ${r.rows.slice((c.stops||[]).length).map(row=>`<tr style="background:var(--bg3);">
        <td></td><td style="text-align:left;">${esc(row.name)}</td><td></td>
        <td class="mono">${esc(row.arrive||'')}</td><td class="mono">${esc(row.leave||'')}</td>
        <td class="mono xs">${row.move||0}分</td><td></td><td class="mono xs">${row.work?row.work+'分':''}</td>
        <td class="mono xs">${(row.km||0).toFixed(1)}km</td><td></td></tr>`).join('')}
    </table></div>
    <div class="row" style="margin-top:8px;">
      <select id="cs-add" class="fi" style="max-width:280px;">${opts}</select>
      <button class="btn gh" onclick="addStop()">立ち寄り先を追加</button>
      <button class="btn grn" style="margin-left:auto;" onclick="saveCourses()">コースを保存</button>
    </div>`;
  drawMap(c);
}
function setDepart(v){ const c=curCourse(); if(!c) return; c.depart=v; renderCourse(); }
function setPost(v){ const c=curCourse(); if(!c) return; c.post=v||null; renderCourse(); }
function setStop(i, key, v){
  const c=curCourse(); if(!c) return;
  if(key==='work') c.stops[i].work = v===''?null:Number(v);
  else c.stops[i][key]=v;
  renderCourse();
}
function addStop(){
  const c=curCourse(); if(!c) return;
  const id=$('cs-add')?.value; if(!id) return;
  c.stops=[...(c.stops||[]), {custId:Number(id), at:'', work:null}];
  renderCourse();
}
function moveStop(i, d){
  const c=curCourse(); if(!c) return;
  const j=i+d; if(j<0 || j>=c.stops.length) return;
  const t=c.stops[i]; c.stops[i]=c.stops[j]; c.stops[j]=t;
  renderCourse();
}
function delStop(i){ const c=curCourse(); if(!c) return; c.stops.splice(i,1); renderCourse(); }
// ★ 2026-09-24.6: 地図をクリックして顧客の位置を決める
let _pickCustId=null;
function pickOnMap(custId){
  _pickCustId=custId;
  const cu=(D.customers||[]).find(x=>String(x.id)===String(custId));
  alert(`${cu?cu.name:''} の位置を決めます。地図の該当地点をクリックしてください。`);
}
async function _onMapClick(e){
  if(!_pickCustId) return;
  const cu=(D.customers||[]).find(x=>String(x.id)===String(_pickCustId));
  _pickCustId=null;
  if(!cu) return;
  cu.lat=Number(e.latlng.lat.toFixed(6));
  cu.lng=Number(e.latlng.lng.toFixed(6));
  const ok=await fbSet('customers', D.customers);
  renderCourse();
  alert(ok?`${cu.name} の位置を設定しました`:'端末には保存しましたが、サーバーへの保存に失敗しました。');
}

// ── 地図 ──
function drawMap(c){
  if(typeof L==='undefined') return;
  const el=$('cs-map'); if(!el) return;
  if(!_csMap){
    _csMap=L.map(el).setView([34.5731,135.4829], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(_csMap);
    _csMap.on('click', _onMapClick);
  }
  if(_csLayer){ _csMap.removeLayer(_csLayer); _csLayer=null; }
  if(!c) return;
  const pts=[];
  const start=officePos($('sh-off').value||'');
  const group=[];
  if(start && start.lat){ pts.push([start.lat,start.lng]);
    group.push(L.marker([start.lat,start.lng]).bindPopup(`${start.name}（営業所）`)); }
  (c.stops||[]).forEach((st,i)=>{
    const p=custPos(st.custId);
    if(!p || !p.lat) return;
    pts.push([p.lat,p.lng]);
    group.push(L.marker([p.lat,p.lng]).bindPopup(`${i+1}. ${p.name}${st.at?'（'+st.at+'）':''}<br>${p.addr||''}`));
  });
  if(c.post){
    const p=officePos(c.post);
    if(p && p.lat){ pts.push([p.lat,p.lng]); group.push(L.marker([p.lat,p.lng]).bindPopup(`${p.name}（持込）`)); }
  }
  if(start && start.lat && pts.length>1) pts.push([start.lat,start.lng]);
  if(pts.length>1) group.push(L.polyline(pts, {weight:3, opacity:.7}));
  if(!group.length) return;
  _csLayer=L.layerGroup(group).addTo(_csMap);
  try{ _csMap.fitBounds(L.latLngBounds(pts), {padding:[30,30]}); }catch(e){}
  setTimeout(()=>{ try{ _csMap.invalidateSize(); }catch(e){} }, 100);
}

function printSheet(){
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  const tbl=$('sh-table'); if(!tbl) return;
  const clone=tbl.cloneNode(true);
  clone.querySelectorAll('.num').forEach(el=>el.remove());
  const w=window.open('', '_blank');
  if(!w){ alert('印刷用の画面を開けませんでした。ポップアップの設定を確認してください。'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(office)} ${esc(mon)} シフト表</title>
    <style>body{font-family:sans-serif;padding:10px;}h1{font-size:15px;margin:0 0 8px;}
    table{border-collapse:collapse;font-size:10px;width:100%;}
    th,td{border:1px solid #999;padding:2px 3px;text-align:center;}
    td:first-child,th:first-child{text-align:left;white-space:nowrap;}
    @page{size:A4 landscape;margin:8mm;}</style></head><body>
    <h1>${esc(office)}　${esc(mon)}　シフト表</h1>${clone.outerHTML}
    <script>window.onload=()=>window.print();<\/script></body></html>`);
  w.document.close();
}
