<style>
  :root{
    --bg:#10141a; --bg2:#161b23; --bg3:#1d232d; --brd:#2b333f; --brd2:#39424f;
    --txt:#e8edf4; --txt2:#97a3b4; --accent:#2f80ed; --grn:#009c5a; --amb:#e08b1f; --red:#d9534f;
    --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  /* ★ 2026-09-24.30: ヘッダーの「黒」「白」で切り替え。未設定なら端末の設定に合わせる */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f6f9; --bg2:#fff; --bg3:#eef1f6; --brd:#d8dee8; --brd2:#c3ccd9;
      --txt:#1b2430; --txt2:#5d6b7d;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9; --bg2:#fff; --bg3:#eef1f6; --brd:#d8dee8; --brd2:#c3ccd9;
    --txt:#1b2430; --txt2:#5d6b7d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  header{background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50;}
  h1{font-size:15px;margin:0;font-weight:700;}
  .ver{font-family:var(--mono);font-size:10px;color:var(--txt2);}
  .wrap{padding:12px 14px 40px;max-width:100%;}
  .card{background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:12px;margin-bottom:12px;}
  .fi{background:var(--bg3);border:1px solid var(--brd2);border-radius:5px;padding:6px 9px;color:var(--txt);
    font-family:inherit;font-size:13px;outline:none;max-width:100%;}
  .btn{border:1px solid var(--brd2);background:var(--bg3);color:var(--txt);border-radius:6px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn.grn{background:var(--grn);border-color:var(--grn);color:#fff;}
  .btn.gh{background:transparent;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--txt2);}
  .xs{font-size:11.5px;}
  .tw{overflow:auto;max-height:64vh;border:1px solid var(--brd);border-radius:6px;}
  table{border-collapse:collapse;font-size:12.5px;width:100%;}
  th,td{border:1px solid var(--brd);padding:5px 4px;text-align:center;white-space:nowrap;}
  thead th{position:sticky;top:0;background:var(--bg3);z-index:2;}
  tbody td:first-child,thead th:first-child,tfoot td:first-child{position:sticky;left:0;background:var(--bg2) !important;
    text-align:left;z-index:3;box-shadow:1px 0 0 var(--brd) inset, -1px 0 0 var(--brd);}
  thead th:first-child{z-index:4;}
  tfoot tr{position:sticky;bottom:0;z-index:2;}
  tfoot td{background:var(--bg3);}
  @media print{ th,td{border:1px solid #999 !important;} }
  tfoot td{background:var(--bg3);font-weight:700;}
  .cell{cursor:pointer;user-select:none;}
  .cell:focus{outline:2px solid var(--accent);outline-offset:-2px;}
  .al{border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:10px;}
  .al-w{background:rgba(224,139,31,.12);border:1px solid rgba(224,139,31,.4);}
  .al-e{background:rgba(217,83,79,.12);border:1px solid rgba(217,83,79,.4);}
  .mono{font-family:var(--mono);}
  /* ★ 2026-09-24.8: スマホ表示 */
  #sh-table td:first-child, #sh-table th:first-child{overflow:hidden;}
  #sh-table .cell{overflow:hidden;}
  @media (max-width: 720px){
    header{padding:8px 10px;gap:6px;position:static;}
    h1{font-size:13px;}
    .wrap{padding:8px 8px 60px;}
    .card{padding:8px;margin-bottom:8px;}
    .btn{padding:8px 10px;font-size:12px;}
    .fi{font-size:12px;padding:7px 8px;}
    #off-tabs, #mon-tabs, #view-tabs, #opt-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    #off-tabs .btn, #mon-tabs .btn, #view-tabs .btn, #opt-tabs .btn, #opt-tabs .fi{white-space:nowrap;flex:0 0 auto;}
    .tw{max-height:70vh;}
    table{font-size:10.5px;}
    th,td{padding:2px 3px;}
    thead th{font-size:9.5px;}
    /* 1列目（氏名・項目）を固定したまま、横スクロールで日付を送る */
    tbody td:first-child,thead th:first-child,tfoot td:first-child{min-width:86px;max-width:110px;white-space:normal;}
    .cell{min-width:26px;}
    #cs-map{height:300px;}
    /* 予測の入力欄は縦に積む */
    #fc-card .row{gap:6px;}
    #fc-card .row > div{flex:1 1 46%;}
  }
  @media (max-width: 420px){
    table{font-size:10px;}
    .cell{min-width:24px;}
  }
</style>

<header>
  <div>
    <h1>大阪急配　シフト表</h1>
    <div class="ver" id="app-ver">ver 2026-09-25.26</div>
  </div>
  <div class="row" style="margin-left:auto;">
    <select id="sh-off" class="fi" style="display:none;"></select>
    <input type="month" id="sh-mon" class="fi">
    <span id="fb-state" class="xs muted">接続中…</span>
  </div>
  <div class="row" id="off-tabs" style="flex-basis:100%;gap:4px;"></div>

</header>

      <div class="row" style="justify-content:space-between;margin-bottom:6px;">
        <div class="xs fw7" id="pane2-title"></div>
        <div class="row" style="gap:6px;">
          <button class="btn gh" onclick="saveDraft2()">下書き保存</button>
          <button class="btn grn" onclick="save2()">確定して保存</button>
        </div>
      </div>
      <div id="sh-root2"></div>
    </div>
  </div>
  <div id="course-wrap" style="display:none;">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <select id="cs-sel" class="fi" onchange="renderCourse()"></select>
          <button class="btn gh" onclick="newCourse()">＋コースを追加</button>
          <button class="btn gh" onclick="delCourse()">削除</button>
          <span class="xs muted">このコースの営業所</span>
          <select id="cs-office" class="fi" style="width:auto;" onchange="moveCourseOffice(this.value)"></select>

        <div class="row xs muted">

          　持込 <input type="number" id="cs-post-work" class="fi" style="width:55px;" value="20" onchange="renderCourse()"> 分
        </div>
      </div>
    </div>
    <div class="card"><div id="cs-root"></div></div>
    <div class="card">

        <button class="btn gh" onclick="useFound('stop')">選択中の立ち寄り先に</button>
        <button class="btn gh" onclick="useFound('post')">持込先の郵便局に</button>
      </div>
      <div class="xs muted" id="map-q-note" style="margin-bottom:6px;">地図をクリックすると赤いピンが置けます。ピンはドラッグで動かせます。</div>
      <div id="cs-map" style="height:420px;border-radius:6px;"></div>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const _ymNorm = v => String(v||'').replace(/\//g,'-').slice(0,7);

// ── データ（経営管理と同じFirebaseを見る） ──
const D = {
  staff: lsGet('nikki_staff_full', []) || [],
  locations: lsGet('nikki_locations', []) || [],
  departments: lsGet('nikki_departments', []) || [],
  delivery: lsGet('nikki_delivery', []) || [],
  shifts: lsGet('nikki_shifts', {}) || {},
  settings: lsGet('nikki_shift_settings', {}) || {},
  customers: lsGet('nikki_customers', []) || [],
  offices: lsGet('nikki_offices', []) || [],
  courses: lsGet('nikki_col_courses', []) || [],
  drafts: lsGet('nikki_shift_drafts', {}) || {},   // ★ 2026-09-24.35: 下書き（確定前）
  saleEvents: lsGet('nikki_sale_events', []) || [],   // ★ 2026-09-24.3: セールカレンダー
};
let fbDB = null;

function setState(txt, ok){
  const el=$('fb-state'); if(!el) return;
  el.textContent = txt;
  el.style.color = ok ? 'var(--grn)' : 'var(--txt2)';
}
async function initFirebase(){
  const { initializeApp, getDatabase, getAuth, signInAnonymously, onIdTokenChanged, ref, onValue } = window._fbImports || {};
  if(!initializeApp){ setState('接続できません（オフライン表示）', false); render(); return; }
  const app = initializeApp(FB_CONFIG, 'kyuhai-shift');
  try{
    const auth = getAuth(app);
    await new Promise(res=>{
      let done=false;
      onIdTokenChanged(auth, u=>{ if(u && !done){ done=true; res(); } });
      signInAnonymously(auth).catch(e=>console.warn('匿名認証に失敗', e));
      setTimeout(()=>{ if(!done){ done=true; res(); } }, 12000);
    });
  }catch(e){ console.warn('認証に失敗', e); }
  fbDB = getDatabase(app);
  const sub = (node, key, cb) => {
    onValue(ref(fbDB, 'nikki/'+node), snap=>{
      if(!snap.exists()) return;
      const v=snap.val();
      // ★ 2026-09-24.36: shifts・drafts・settings はキー付きの箱なので、そのまま入れる
      const asObject = (key==='shifts' || key==='drafts' || key==='settings');
      D[key] = Array.isArray(v) ? v : (asObject ? (v||{}) : (v ? Object.values(v) : []));
      lsSet('nikki_'+node, D[key]);
      if(cb) cb();
    }, err=>console.warn('['+node+']', err && err.message));
  };
  sub('staff_full','staff', render);
  sub('locations','locations', fillOffices);
  sub('departments','departments', fillOffices);
  sub('delivery','delivery', render);
  sub('shifts','shifts', render);
  sub('shift_drafts','drafts', ()=>{ if(_view==='shift') render(); });
  sub('sale_events','saleEvents', render);
  sub('customers','customers', ()=>{ if(_view==='course') renderCourse(); });
  sub('offices','offices', ()=>{ if(_view==='course') renderCourse(); });
  sub('col_courses','courses', ()=>{ if(_view==='course') renderCourse(); });
  onValue(ref(fbDB,'nikki/shift_settings'), snap=>{
    if(!snap.exists()) return;
    D.settings=snap.val()||{};
    lsSet('nikki_shift_settings', D.settings);
    render();
  }, err=>console.warn('[shift_settings]', err && err.message));
  setState('接続済み', true);
}
let _lastFbError='';
async function fbSet(node, value){
  lsSet('nikki_'+node, value);
  if(!fbDB){ _lastFbError='サーバーに接続していません'; return false; }
  const { ref, set } = window._fbImports;
  try{ await set(ref(fbDB, 'nikki/'+node), value); _lastFbError=''; return true; }
  catch(e){ _lastFbError=(e&&e.message)||String(e); console.warn('保存に失敗', node, e); return false; }
}

// ★ 2026-09-24.20: 〇→×→（その先はリストから選ぶ）。〜③は廃止し、②〜を追加
const SHIFT_CODES = ['', '〇', '×', '1', '2', '3', '~1', '~2', '2~'];
const SHIFT_LABEL = {'':'', '〇':'〇', '×':'×', '1':'①', '2':'②', '3':'③', '~1':'〜①', '~2':'〜②', '2~':'②〜'};

const SHIFT_WEIGHT_DEF = {'〇':1, '×':0, '1':0.3, '2':0.3, '3':0.3, '~1':0.3, '~2':0.6, '2~':0.6};
const weights = () => ({...SHIFT_WEIGHT_DEF, ...(D.settings?.weights||{})});
async function saveWeights(){
  const w={};
  ['〇','1','2','3','~1','~2','2~'].forEach(k=>{
    const el=document.querySelector(`.wgt-in[data-k="${k}"]`);

  const ids=(st.deptIds||[]).map(String);

function staffOf(office, all){
  const col=isColOffice(office);
  const list=(D.staff||[]).filter(s=>{
    if(!s || s.status==='終了') return false;
    if(col){
      // ★ 2026-09-25.2: 集荷の営業所は「集荷事業部のチェック」で判定（担当郵便局は見ない）。
      //   委託会社所属は出さない。
      if(s.companyId || s.companyName) return false;
      return hasDept(s, 'col');
    }
    // 宅配の営業所は、担当郵便局（メイン＋複数対応）＋宅配事業部のチェック
    if(!hasDept(s, 'del')) return false;
    if(s.office===office) return true;
    return (s.subOffices||[]).some(o=>(typeof o==='string'?o:o?.name)===office);
  });
  const ord=orderOf(office);
  list.sort((a,b)=>{
    const ia=ord.indexOf(staffKey(a)), ib=ord.indexOf(staffKey(b));
    if(ia>=0 || ib>=0){
      if(ia<0) return 1; if(ib<0) return -1;
      return ia-ib;

    return String(a.empNo||'').localeCompare(String(b.empNo||''));
  });

  return list.filter(s=>!hid.includes(staffKey(s)));

// ★ 2026-09-24.34: 平均に加えて「期間内の最大持出トップ5の平均」も出す
function avgMochidashi(st, mon){
  const base=new Date((mon||new Date().toISOString().slice(0,7))+'-01');
  const from=new Date(base.getFullYear(), base.getMonth()-6, 1);
  const rows=(D.delivery||[]).filter(r=>{
    if(!r || r.staff!==st.name) return false;
    const d=new Date(String(r.date||'').replace(/\//g,'-')+'T00:00:00');
    return !isNaN(d) && d>=from && d<base;
  });
  if(!rows.length) return {avg:80, max5:80, isNew:true};
  const months=new Set(rows.map(r=>String(r.date).slice(0,7))).size;
  if(months<=2) return {avg:80, max5:80, isNew:true};
  const qty=rows.map(r=>Number(r.mochidashi)||0).filter(v=>v>0).sort((a,b)=>b-a);
  if(!qty.length) return {avg:80, max5:80, isNew:true};
  const avg=Math.round(qty.reduce((a,b)=>a+b,0)/qty.length);
  const top=qty.slice(0, Math.min(5, qty.length));
  const max5=Math.round(top.reduce((a,b)=>a+b,0)/top.length);
  return {avg: avg>0?avg:80, max5: max5>0?max5:80, isNew:false};
}

function dailyTotals(office, fromYm, toYm){
  const map={};

  (D.delivery||[]).forEach(r=>{
    if(!r || !names.has(r.staff)) return;
    const d=String(r.date||'').replace(/\//g,'-');
    const ym=d.slice(0,7);
    if(fromYm && ym<fromYm) return;

}

function dowFactors(office, mon){
  const src=dowSrcOf(office).split(',').map(x=>_ymNorm(x.trim())).filter(x=>/^\d{4}-\d{2}$/.test(x));

  }
  // ★ 2026-09-24.38: 実績のない日も0として数える（配達していない日曜が消えないように）
  //   祝日は日曜の枠、祝日の翌日は月曜の枠として集計する
  const sum=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  const months=new Set(Object.keys(map).map(d=>d.slice(0,7)));
  if(src.length) src.forEach(x=>months.add(x));
  const slotOf=(iso)=>{
    if(holidayName(iso)) return 0;                       // 祝日 → 日曜の枠
    const dt=new Date(iso+'T00:00:00');
    const prev=new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()-1);
    const pIso=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
    if(holidayName(pIso)) return 1;                      // 祝日の翌日 → 月曜の枠
    return dt.getDay();
  };
  months.forEach(ym=>{
    const [yy,mm]=ym.split('-').map(Number);
    if(!yy||!mm) return;
    const lastD=new Date(yy,mm,0).getDate();
    for(let d=1; d<=lastD; d++){
      const iso=`${ym}-${String(d).padStart(2,'0')}`;
      const slot=slotOf(iso);
      sum[slot]+=(map[iso]||0);
      cnt[slot]++;
    }
  });
  const avg=sum.map((s,i)=>cnt[i]?s/cnt[i]:0);
  const used=avg.filter(v=>v>0);
  const ovAll=(D.settings?.dowOverride||{})[office]||{};
  // ★ 2026-09-24.52: 実績が無くても、手入力の係数は使う
  if(!used.length){
    const hasOv=Object.keys(ovAll).length>0;
    const f0=[0,1,2,3,4,5,6].map(i => (ovAll[i]!=null && ovAll[i]!=='') ? Number(ovAll[i])/100 : 1);
    return {f:f0, hasData:hasOv, src:src, ov:ovAll};
  }
  const mean=used.reduce((a,b)=>a+b,0)/used.length;
  let f=avg.map(v=>v>0?v/mean:0);
  // 手で上書きした係数があれば、それを優先する（％で保存）
  f=f.map((v,i)=> (ovAll[i]!=null && ovAll[i]!=='') ? Number(ovAll[i])/100 : v);
  return {f, hasData:true, src:src, ov:ovAll};
}
// 前年同月の実績合計
function lastYearTotal(office, mon){

  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  return Object.values(map).reduce((a,b)=>a+b,0);
}
// 月合計を曜日係数で31日に割り振る
function spreadByDow(total, mon, fac, saleMap){
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const raw=[];
  let sum=0;
  for(let d=1; d<=last; d++){
    const key=`${mon}-${String(d).padStart(2,'0')}`;
    // ★ 2026-09-24.38: 祝日は日曜、祝日の翌日は月曜の係数を使う
    let dow;
    if(holidayName(key)) dow=0;
    else {
      const dt=new Date(key+'T00:00:00');
      const prev=new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()-1);
      const pIso=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
      dow = holidayName(pIso) ? 1 : dt.getDay();
    }
    const v=(fac[dow]||0) * ((saleMap && saleMap[key]) ? saleMap[key].factor : 1);
    raw.push(v); sum+=v;
  }
  if(!sum) return raw.map(()=>0);
  return raw.map(v=>Math.round(total*v/sum));
}

// ★ 2026-09-24.18: 媒体名がCSVに無い場合は、セール名から推定する
const MEDIA_RULES=[
  ['楽天', ['楽天','スーパーSALE','スーパーセール','お買い物マラソン','イーグルス']],
  ['Amazon', ['Amazon','アマゾン','プライム']],
  ['Yahoo', ['Yahoo','ヤフー','PayPay','ゾロ目','5のつく日']],
  ['Qoo10', ['Qoo10','キューテン','メガ割']],
  ['ヨドバシ', ['ヨドバシ']],
  ['ZOZO', ['ZOZO','ゾゾ']],
  ['au PAY', ['au PAY','auPAY','三太郎']],
];
function inferMedia(name, media){
  const m=String(media||'').trim();
  if(m && m!=='その他') return m;
  const t=String(name||'');
  for(const [label, words] of MEDIA_RULES){
    if(words.some(w=>t.toLowerCase().includes(String(w).toLowerCase()))) return label;
  }
  return m || 'その他';
}
// セール名から媒体名を取り除いた短い名前
function shortSaleName(name, media){
  let t=String(name||'').trim();
  if(media) t=t.replace(new RegExp('^'+media.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\s　]*'),'');
  return t || name || '';
}

// ★ 2026-09-24.17: 大型セールは色を強くする
const BIG_SALE_WORDS=['スーパーセール','感謝祭','ブラックフライデー','メガ割','大感謝','超PayPay','年末年始','クリスマス','お年玉'];
function isBigSale(name){ return BIG_SALE_WORDS.some(w=>String(name||'').includes(w)); }
const MEDIA_COLORS=['#c0392b','#2e7d32','#e67e22','#8e44ad','#2980b9','#c2185b','#00838f','#6d4c41'];
function mediaColor(name){
  let h=0; for(const ch of String(name||'')) h=(h*31+ch.charCodeAt(0))%997;
  return MEDIA_COLORS[h%MEDIA_COLORS.length];
}
// ★ 2026-09-24.16: 反映日ベースで「媒体 → セール期間」を作る。重なる期間は段を分ける
function saleLanes(mon){
  const byMedia={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    if(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`!==mon) return;
    const media=inferMedia(e.name, e.media);
    const name=shortSaleName(e.name||'セール', media);
    const day=d.getDate();
    const list=(byMedia[media]=byMedia[media]||[]);
    // ★ 2026-09-24.28: セール名ごとにまとめる（先行と本番は別の帯）
    const hit=list.find(x=>x.name===name && (x.to===day-1 || x.from===day+1 || (day>=x.from&&day<=x.to)));
    if(hit){ hit.from=Math.min(hit.from,day); hit.to=Math.max(hit.to,day); }
    else list.push({name, names:[name], from:day, to:day});
  });
  // 重なるものは段を分ける
  const lanes={};
  Object.entries(byMedia).forEach(([media, list])=>{
    const sorted=list.slice().sort((x,y)=>x.from-y.from);
    const rows=[];
    sorted.forEach(ev=>{
      let row=rows.find(r=>r.every(x=>ev.from>x.to || ev.to<x.from));
      if(!row){ row=[]; rows.push(row); }
      row.push(ev);
    });
    lanes[media]=rows;
  });
  return lanes;
}
// セールの帯（シフト表のヘッダーに入れて、日付の列とずれないようにする）
function laneRowsHTML(mon, last){
  const lanes=saleLanes(mon);
  const empty='<th style="border-color:transparent;background:transparent;"></th>';
  let html='';
  Object.keys(lanes).forEach(media=>{
    const col=mediaColor(media);
    lanes[media].forEach((row, ri)=>{
      let tds='', d=1;
      while(d<=last){
        const ev=row.find(x=>x.from===d);
        if(ev){
          const span=Math.min(ev.to, last)-d+1;
          const big=isBigSale(ev.name);
          const maxCh=4;   // 媒体名はすべて同じ長さ（3文字＋…）に揃える
          let lbl=media+(big?'★':'');
          if(lbl.length>maxCh) lbl=lbl.slice(0, Math.max(1,maxCh-1))+'…';
          tds+=`<th colspan="${span}" title="${esc(media)} ${esc((ev.names||[ev.name]).join(' / '))}"
            style="padding:1px 2px;border-color:transparent;background:transparent;">
            <div style="background:${big?'#d9534f':col};color:#fff;font-size:9.5px;font-weight:${big?'800':'700'};
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:9px;padding:1px 6px;line-height:1.4;
              width:100%;box-sizing:border-box;
              ${big?'box-shadow:0 0 0 1px rgba(255,255,255,.35) inset;':''}">${esc(lbl)}</div></th>`;
          d+=span;
        } else { tds+=empty; d++; }
      }
      html+=`<tr><th style="text-align:left;font-size:11px;color:${col};background:var(--bg2);">${ri===0?esc(media):''}</th>${tds}
        <th style="border-color:transparent;background:var(--bg2);"></th><th class="num" style="border-color:transparent;background:var(--bg2);"></th></tr>`;
    });
  });
  return html;
}

// ★ 2026-09-24.13: セールを媒体ごとの帯で出す（連続する期間は1本の帯、中に名称）
function saleBarsHTML(mon){
  const [y,m]=mon.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const W='日月火水木金土';
  // 反映日（ずらし後）ごとに、媒体＋名称で並べる
  const byMedia={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(key!==mon) return;
    const media=e.media||'その他';
    const day=d.getDate();
    (byMedia[media]=byMedia[media]||{})[day]=e.name||'セール';
  });
  const medias=Object.keys(byMedia);
  if(!medias.length) return '';
  let head='<tr><th style="min-width:86px;">媒体</th>';
  for(let d=1; d<=last; d++){
    const iso=`${mon}-${String(d).padStart(2,'0')}`;
    const dow=new Date(iso+'T00:00:00').getDay();
    const hol=holidayName(iso);
    const col=(dow===0||hol)?'color:#e06666;':dow===6?'color:#6fa8dc;':'';
    head+=`<th style="${col}min-width:26px;">${d}<div class="xs" style="${col}">${W[dow]}</div></th>`;
  }
  head+='</tr>';
  const rows=medias.map(mm=>{
    const days=byMedia[mm];
    let tds='', d=1;
    while(d<=last){
      const name=days[d];
      if(!name){ tds+='<td></td>'; d++; continue; }
      let span=1;
      while(d+span<=last && days[d+span]===name) span++;
      tds+=`<td colspan="${span}" title="${esc(name)}"
        style="background:rgba(224,139,31,.22);color:#e08b1f;font-weight:700;border-radius:4px;">${esc(name)}</td>`;
      d+=span;
    }
    return `<tr><td style="text-align:left;">${esc(mm)}</td>${tds}</tr>`;
  }).join('');
  return `<div style="margin-bottom:10px;">
    <div class="xs fw7" style="margin-bottom:4px;">セールの予定（媒体ごと）</div>
    <div class="tw" style="max-height:none;"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

  let h1='<tr><th style="min-width:86px;">日付</th>', h2='<tr><td>祝日</td>', h3='<tr><td>セール</td>';

    const dow=new Date(iso+'T00:00:00').getDay();
    const hol=holidayName(iso);

    if(hol) hasHol=true;

// ★ 2026-09-24.9: その月のセール予定の一覧（媒体名・セール名が分かるように）
function saleListHTML(mon, saleMap){
  // ★ 2026-09-24.27: 週ごとのグリッド。期間をまたぐセールは1本のバーでつなぐ
  const [y,m]=mon.split('-').map(Number);
  const first=new Date(y, m-1, 1), last=new Date(y, m, 0).getDate();
  const startDow=first.getDay();
  // 反映日ベースの期間（媒体＋名称ごと）
  const evs=[];
  const tmp={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    if(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`!==mon) return;
    const media=inferMedia(e.name, e.media);
    const name=shortSaleName(e.name||'セール', media);
    const key=media+'|'+name;
    const day=d.getDate();
    if(tmp[key] && (tmp[key].to===day-1 || (day>=tmp[key].from && day<=tmp[key].to))){
      tmp[key].to=Math.max(tmp[key].to, day);
    } else {
      tmp[key]={media, name, from:day, to:day, big:isBigSale(e.name)};
      evs.push(tmp[key]);
    }
  });
  if(!evs.length) return '';
  const dowL=['日','月','火','水','木','金','土'];
  const weeks=[];
  for(let d=1-startDow; d<=last; d+=7) weeks.push(d);
  const head=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--brd);">
    ${dowL.map((w,i)=>`<div style="padding:6px 4px;text-align:center;font-size:11px;font-weight:700;background:var(--bg3);
      color:${i===0?'#e06666':i===6?'#6fa8dc':'var(--txt2)'};">${w}</div>`).join('')}</div>`;
  const body=weeks.map(ws=>{
    // 日付の行
    let days='';
    for(let i=0;i<7;i++){
      const d=ws+i;
      if(d<1||d>last){ days+='<div style="background:var(--bg);"></div>'; continue; }
      const iso=`${mon}-${String(d).padStart(2,'0')}`;
      const wd=new Date(iso+'T00:00:00').getDay();
      const hol=holidayName(iso);
      const col=(wd===0||hol)?'#e06666':wd===6?'#6fa8dc':'var(--txt)';
      const bg=(wd===0||hol)?'rgba(224,102,102,.08)':wd===6?'rgba(111,168,220,.08)':'var(--bg2)';
      days+=`<div style="background:${bg};padding:4px 6px;font-size:11.5px;font-weight:700;color:${col};">
        ${d}${hol?`<span class="xs" style="color:#e06666;"> ${esc(hol)}</span>`:''}</div>`;
    }
    // その週に掛かる期間を段に積む
    const wk=evs.filter(e=>e.to>=ws && e.from<=ws+6)
      .map(e=>({...e, s:Math.max(e.from, ws), t:Math.min(e.to, ws+6)}))
      .sort((a,b)=>a.s-b.s || (b.t-b.s)-(a.t-a.s));
    const rows=[];
    wk.forEach(e=>{ let r=rows.find(r=>r.every(x=>e.s>x.t || e.t<x.s)); if(!r){ r=[]; rows.push(r); } r.push(e); });
    const lanes=rows.length;
    const bars=rows.map((row, li)=>row.sort((x,z)=>x.s-z.s).map(e=>{
      const left=((e.s-ws)/7*100), width=((e.t-e.s+1)/7*100);
      const c=e.big?'#d9534f':mediaColor(e.media);
      const cont=e.from<e.s?'〜':'';
      return `<div title="${esc(e.media)} ${esc(e.name)}" style="position:absolute;left:calc(${left}% + 3px);
        width:calc(${width}% - 6px);top:${30+li*20}px;background:${c};color:#fff;border-radius:9px;
        font-size:10.5px;font-weight:${e.big?'800':'700'};padding:2px 8px;box-sizing:border-box;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cont}${esc(e.media)} ${esc(e.name)}</div>`;
    }).join('')).join('');
    const h=Math.max(84, 36+lanes*20);
    return `<div style="position:relative;min-height:${h}px;border-bottom:1px solid var(--brd);">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--brd);position:absolute;inset:0;">${days}</div>
      ${bars}
    </div>`;
  }).join('');
  return `<div style="margin-top:14px;">
    <div class="xs fw7" style="margin-bottom:6px;">${y}年${m}月のセール予定（★は大型セール）</div>
    <div style="border:1px solid var(--brd);border-radius:10px;overflow:hidden;padding:0 0 4px;">${head}${body}</div>
  </div>`;
}

// ★ 2026-09-24.38: 曜日係数の確認と手直し
function dowEditHTML(office, mon, sfx){
  sfx = sfx||'';
  const dw=dowFactors(office, mon);
  const W=['日','月','火','水','木','金','土'];
  const ov=(D.settings?.dowOverride||{})[office]||{};
  // ★ 2026-09-24.52: 曜日ごとに、その月で何個ずつ割り振られたかを出す
  const data=shGet(office, mon);
  const total=Number(data.forecast?.total)||0;
  const [yy,mm]=mon.split('-').map(Number);
  const lastD=new Date(yy,mm,0).getDate();
  const plan=total?spreadByDow(total, mon, dw.f, _saleFactorMap(mon)):[];
  const sumByDow=[0,0,0,0,0,0,0], cntByDow=[0,0,0,0,0,0,0];
  for(let d=1; d<=lastD; d++){
    const iso=`${mon}-${String(d).padStart(2,'0')}`;
    let slot;
    if(holidayName(iso)) slot=0;
    else {
      const dt=new Date(iso+'T00:00:00');
      const prev=new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()-1);
      const pIso=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
      slot = holidayName(pIso) ? 1 : dt.getDay();
    }
    sumByDow[slot]+=(plan[d-1]||0);
    cntByDow[slot]++;
  }
  const planTotal=plan.reduce((a,b)=>a+b,0);
  return `<div class="row" style="margin-top:12px;gap:6px;align-items:center;flex-wrap:wrap;">
    <span class="xs fw7">曜日の係数（％）</span>
    ${W.map((w,i)=>`<span class="xs muted">${w}</span>
      <input type="number" class="fi dow-in${sfx}" data-i="${i}" style="width:62px;"
        value="${ov[i]!=null&&ov[i]!==''?ov[i]:Math.round((dw.f[i]||0)*100)}">`).join('')}
    <button class="btn gh" onclick="saveDowOverride('${esc(office)}','${sfx}')">係数を保存</button>
    <button class="btn gh" onclick="clearDowOverride('${esc(office)}')">実績に戻す</button>
    <span class="xs muted" style="flex-basis:100%;">係数は「平均を100%としたときの重み」です。月の合計は必ず予測の合計になるよう割り戻します（祝日は日曜、祝日の翌日は月曜として計算します）。</span>
    ${total?`<div style="flex-basis:100%;margin-top:6px;">
      <div class="tw" style="max-height:none;"><table>
        <thead><tr><th>曜日</th>${W.map(w=>`<th>${w}</th>`).join('')}<th>合計</th></tr></thead>
        <tbody>
          <tr><td style="text-align:left;">この月の日数</td>${cntByDow.map(v=>`<td>${v}日</td>`).join('')}<td>${lastD}日</td></tr>
          <tr><td style="text-align:left;">割り振り（個）</td>${sumByDow.map(v=>`<td>${v.toLocaleString()}</td>`).join('')}<td class="fw7">${planTotal.toLocaleString()}</td></tr>
          <tr><td style="text-align:left;">1日あたり</td>${sumByDow.map((v,i)=>`<td>${cntByDow[i]?Math.round(v/cntByDow[i]).toLocaleString():''}</td>`).join('')}<td></td></tr>
          <tr><td style="text-align:left;">全体に占める割合</td>${sumByDow.map(v=>`<td>${planTotal?Math.round(v/planTotal*100):0}%</td>`).join('')}<td class="fw7">100%</td></tr>
        </tbody></table></div>
      <div class="xs muted" style="margin-top:4px;">祝日は日曜の欄、祝日の翌日は月曜の欄に入ります。セールの係数も反映した後の数字です。</div>
    </div>`:'<span class="xs muted" style="flex-basis:100%;">月の予測合計を入れると、曜日ごとの割り振り（個数）が出ます。</span>'}
  </div>`;
}
async function saveDowOverride(office, sfx){
  office = office || $('sh-off').value||'';
  const ov={};
  document.querySelectorAll('.dow-in'+(sfx||'')).forEach(el=>{ ov[el.dataset.i]=Number(el.value)||0; });
  const st={...(D.settings||{})};
  st.dowOverride={...(st.dowOverride||{}), [office]:ov};
  D.settings=st;
  const ok=await fbSet('shift_settings', st);
  render();
  if(!ok) alert('端末には保存しましたが、サーバーへの保存に失敗しました。');
}
async function clearDowOverride(office){
  office = office || $('sh-off').value||'';
  const st={...(D.settings||{})};
  const o={...(st.dowOverride||{})}; delete o[office];
  st.dowOverride=o; D.settings=st;
  const ok=await fbSet('shift_settings', st);
  render();

// ★ 2026-09-24.31: 矢印キーとEnterでますを移動、リストは矢印キーで選ぶ
function cellKey(e, td){
  if(document.querySelector('.pick-menu')) return;   // リストを開いている間は動かさない
  const cells=[...document.querySelectorAll('#sh-table .cell')];
  const cols=Number(td.closest('table').querySelectorAll('thead tr:last-child th').length)-3;
  const i=cells.indexOf(td);
  const move=n=>{ const t=cells[i+n]; if(t){ t.focus(); e.preventDefault(); } };
  switch(e.key){
    case 'ArrowRight': case 'Enter': move(1); break;
    case 'ArrowLeft': move(-1); break;
    case 'ArrowDown': move(cols); break;
    case 'ArrowUp': move(-cols); break;
    case ' ': e.preventDefault(); td.click(); break;
    default: return;
  }
}
// ますの上に出す選択リスト（矢印キーで選ぶ）
function openPickMenu(td, items, onPick){
  document.querySelectorAll('.pick-menu').forEach(el=>el.remove());
  const r=td.getBoundingClientRect();
  const box=document.createElement('div');
  box.className='pick-menu';
  box.style.cssText=`position:fixed;left:${Math.min(r.left, window.innerWidth-220)}px;top:${Math.min(r.bottom+2, window.innerHeight-40)}px;
    background:var(--bg2);border:1px solid var(--brd2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.35);
    z-index:99;min-width:200px;max-height:60vh;overflow:auto;padding:4px;`;
  let idx=0;
  const draw=()=>{
    box.innerHTML=items.map((it,i)=>`<div data-i="${i}" style="padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;
      ${i===idx?'background:var(--accent);color:#fff;font-weight:700;':''}">${esc(it.label)}</div>`).join('');
  };
  draw();
  box.addEventListener('mousedown', ev=>{
    const el=ev.target.closest('[data-i]'); if(!el) return;
    ev.preventDefault(); close(); onPick(items[Number(el.dataset.i)].value);
  });
  // ★ 2026-09-24.33: リストを開いている間は、ますの移動にキーを渡さない
  const key=ev=>{
    const stop=()=>{ ev.preventDefault(); ev.stopPropagation(); ev.stopImmediatePropagation(); };
    if(ev.key==='ArrowDown'){ idx=(idx+1)%items.length; draw(); stop(); }
    else if(ev.key==='ArrowUp'){ idx=(idx-1+items.length)%items.length; draw(); stop(); }
    else if(ev.key==='Enter'){ stop(); const v=items[idx].value; close(); onPick(v); }
    else if(ev.key==='Escape'){ stop(); close(); }
    else if(ev.key===' '){ stop(); }
  };
  function close(){ document.removeEventListener('keydown', key, true); box.remove(); td.focus(); }
  document.addEventListener('keydown', key, true);
  document.body.appendChild(box);
  setTimeout(()=>{
    const off=ev=>{ if(!box.contains(ev.target)){ close(); document.removeEventListener('mousedown', off, true); } };
    document.addEventListener('mousedown', off, true);
  }, 0);
}

//   CSVの列: 日付, イベント名, 強さ(-3〜3), ずらし日数, 係数(任意), メモ(任意)
//   固定のルールは持たず、係数はいつでも手で上書きできる。
function _saleFactorMap(mon){
  const map={};
  (D.saleEvents||[]).forEach(e=>{
    if(!e || !e.date) return;
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return;
    const shiftDays=Number(e.shiftDays)||0;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+shiftDays);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!key.startsWith(mon)) return;
    const f = (e.factor!=null && e.factor!=='') ? Number(e.factor) : (1 + (Number(e.power)||0)*0.1);
    if(!map[key]) map[key]={factor:1, names:[], items:[]};
    map[key].factor *= (isFinite(f)&&f>0 ? f : 1);
    const label = [e.media, e.name].filter(Boolean).join(' ') || 'セール';
    map[key].names.push(label);
    map[key].items.push({label, factor:(isFinite(f)&&f>0?f:1), src:e});
  });
  return map;
}
function importSaleCsv(input){
  const file=input.files && input.files[0];
  if(!file) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const txt=String(rd.result||'').replace(/^\uFEFF/,'');
      const lines=txt.split(/\r?\n/).filter(l=>l.trim());
      if(!lines.length){ alert('CSVが空です'); return; }
      const head=lines[0].split(',').map(x=>x.trim());
      const idx=name=>head.findIndex(h=>h.replace(/\s/g,'').includes(name));
      const iDate=idx('日付')>=0?idx('日付'):0;
      const iName=idx('イベント')>=0?idx('イベント'):(idx('名')>=0?idx('名'):1);
      const iPow=idx('強')  , iShift=idx('ずら')>=0?idx('ずら'):idx('日数'), iFac=idx('係数'), iMemo=idx('メモ');
      const iMedia=idx('媒体')>=0?idx('媒体'):(idx('サイト')>=0?idx('サイト'):(idx('通販')>=0?idx('通販'):-1));
      const hasHeader = /日付|date/i.test(head[iDate]||'');
      const rows=(hasHeader?lines.slice(1):lines).map(l=>{
        const c=l.split(',').map(x=>x.trim());
        const date=String(c[iDate]||'').replace(/\//g,'-');
        if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date)) return null;
        const [y,m,d]=date.split('-').map(Number);
        return {
          date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
          media: iMedia>=0 ? (c[iMedia]||'') : '',
          name: c[iName]||'セール',
          power: iPow>=0 ? Number(c[iPow])||0 : 0,
          shiftDays: iShift>=0 ? Number(c[iShift])||0 : 0,
          factor: iFac>=0 && c[iFac]!=='' ? Number(c[iFac]) : null,
          memo: iMemo>=0 ? (c[iMemo]||'') : '',
        };
      }).filter(Boolean);
      if(!rows.length){ alert('読み取れる行がありませんでした。1列目に日付（2026-10-05 など）を入れてください。'); return; }
      const keep=(D.saleEvents||[]).filter(e=>!rows.some(r=>r.date===e.date && r.name===e.name && (r.media||'')===(e.media||'')));
      D.saleEvents=[...keep, ...rows].sort((a,b)=>a.date.localeCompare(b.date));
      const ok=await fbSet('sale_events', D.saleEvents);
      render();
      alert(`${rows.length}件を読み込みました${ok?'':'（サーバーへの保存に失敗しました）'}`);
    }catch(e){ console.error(e); alert('CSVの読み込みに失敗しました'); }
    input.value='';
  };
  rd.readAsText(file, 'utf-8');
}

function checkLastYear(){
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  const evs=(D.saleEvents||[]).filter(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    if(isNaN(base)) return false;
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===mon;
  });
  if(!evs.length){ alert('この月に当たるセールの予定がありません。CSVを読み込んでください。'); return; }
  const [y,m]=mon.split('-').map(Number);
  const ly=`${y-1}-${String(m).padStart(2,'0')}`;
  const nextM = m===12 ? `${y}-01` : `${y-1}-${String(m+1).padStart(2,'0')}`;
  const map=dailyTotals(office, ly, nextM);
  const vals=Object.values(map).filter(v=>v>0);
  if(!vals.length){ alert('前年同月の実績がないため、答え合わせができません。'); return; }
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const lines=evs.map(e=>{
    const base=new Date(String(e.date).replace(/\//g,'-')+'T00:00:00');
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+(Number(e.shiftDays)||0));
    const lyd=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const v=map[lyd]||0;
    const pct=v?Math.round(v/mean*100):null;
    const fac=(e.factor!=null&&e.factor!=='')?Number(e.factor):(1+(Number(e.power)||0)*0.1);
    return `${lyd}　${e.name}　前年 ${v?v.toLocaleString()+'個（平常比 '+pct+'%）':'実績なし'}　いまの係数 ${Math.round(fac*100)}%`;

// ★ 2026-09-24.40: 住所から緯度経度を取る（国土地理院 → だめならOSM）
async function geocodeAddress(addr){
  const q=String(addr||'').trim();
  if(!q) return null;
  try{
    const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));
    if(r.ok){
      const list=await r.json();
      const c=Array.isArray(list)&&list.length?list[0]?.geometry?.coordinates:null;
      if(c && c.length>1) return {lat:Number(c[1]), lng:Number(c[0]), src:'国土地理院', label:list[0]?.properties?.title||''};
    }
  }catch(e){ console.warn('[住所検索:国土地理院]', e); }
  try{
    const r2=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(q));
    if(r2.ok){
      const l2=await r2.json();
      if(Array.isArray(l2) && l2.length) return {lat:Number(l2[0].lat), lng:Number(l2[0].lon), src:'OSM', label:l2[0].display_name||''};
    }
  }catch(e){ console.warn('[住所検索:OSM]', e); }
  return null;
}

// ── 距離・時間 ──
function distKm(a, b){
  if(!a || !b || !a.lat || !b.lat) return 0;
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const ROAD_RATIO = 1.3;   // 直線距離 → 道のりの目安
function hm2min(v){ const [h,m]=String(v||'0:00').split(':').map(Number); return (h||0)*60+(m||0); }
function min2hm(v){ v=Math.max(0,Math.round(v)); return `${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`; }

function stopPos(st, office){
  if(st.type==='origin'){
    const o=courseOrigin(curCourse(), office);
    return {lat:o.lat, lng:o.lng, name:'出発地点（戻る）', addr:o.addr||''};

  }
  const base=custPos(st.custId);
  const name=base?base.name:'(位置なし)';
  if(st.loc==='origin'){
    const o=originOf(office);
    return {lat:o.lat, lng:o.lng, name:`${name}（本社ロジ）`, addr:o.addr||''};
  }
  if(st.loc && typeof st.loc==='object' && st.loc.lat){
    return {lat:Number(st.loc.lat), lng:Number(st.loc.lng), name:`${name}（指定）`, addr:st.loc.label||''};
  }
  return base;
}
function officePos(name){
  const ov=posOverride('off:'+name);
  const o=(D.offices||[]).find(x=>x && x.name===name);
  if(ov) return {lat:Number(ov.lat)||0, lng:Number(ov.lng)||0, name:name, addr:(o&&o.addr)||ov.label||''};
  if(!o) return null;
  return {lat:Number(o.lat)||0, lng:Number(o.lng)||0, name:o.name, addr:o.addr||''};
}
// コースの時間を積み上げる
function calcCourse(c){
  const speed=Number($('cs-speed')?.value)||25;
  const workDef=Number($('cs-work')?.value)||10;
  const postWork=Number($('cs-post-work')?.value)||20;
  const start=courseOrigin(c, $('sh-off').value||'');
  // ★ 2026-09-24.46: 分は小数のまま積み上げ、表示のときだけ丸める（距離と時間がずれないように）
  let t=hm2min(c.depart||'10:00');
  let prev=start, km=0;
  const rows=[];
  const showMove=(d,min)=> d>0.05 ? Math.max(1, Math.round(min)) : Math.round(min);
  (c.stops||[]).forEach(st=>{
    const p=stopPos(st, $('sh-off').value||'');
    const d=(prev&&p)?distKm(prev,p)*ROAD_RATIO:0;
    km+=d;
    const mv=speed>0?(d/speed*60):0;
    t+=mv;
    let wait=0;
    if(st.at){ const want=hm2min(st.at); if(want>t){ wait=Math.round(want-t); t=want; } }
    const arrive=t;
    const work=(st.work!=null && st.work!=='') ? Number(st.work)
      : (st.type==='post' ? postWork : st.type==='origin' ? 0 : workDef);
    t+=work;
    rows.push({name:p?p.name:'(位置なし)', arrive:min2hm(Math.round(arrive)), leave:min2hm(Math.round(t)),
      move:showMove(d,mv), wait, work, km:d, at:st.at||'', noPos:!p||!p.lat});
    if(p&&p.lat) prev=p;
  });
  if(c.post){
    const p=officePos(c.post);
    const d=(prev&&p)?distKm(prev,p)*ROAD_RATIO:0;
    km+=d;
    const mv=speed>0?(d/speed*60):0;
    t+=mv;
    const arrive=t;
    t+=postWork;
    rows.push({name:`${c.post}（持込）`, arrive:min2hm(Math.round(arrive)), leave:min2hm(Math.round(t)),
      move:showMove(d,mv), wait:0, work:postWork, km:d, at:'', post:true, noPos:!p||!p.lat});
    if(p&&p.lat) prev=p;
  }
  // 営業所へ戻る
  if(start && prev && prev!==start){
    const d=distKm(prev,start)*ROAD_RATIO; km+=d;
    const mv=speed>0?(d/speed*60):0;
    t+=mv;
    rows.push({name:`${start.name}（帰社）`, arrive:min2hm(Math.round(t)), leave:'', move:showMove(d,mv), wait:0, work:0, km:d, back:true});
  }
  // ★ 2026-09-25.5: 移動・待ち・作業の合計も返す
  const sumMove=rows.reduce((a,r)=>a+(r.move||0),0);
  const sumWait=rows.reduce((a,r)=>a+(r.wait||0),0);
  const sumWork=rows.reduce((a,r)=>a+(r.work||0),0);
  return {rows, endMin:Math.round(t), km, totalMin:Math.round(t-hm2min(c.depart||'10:00')),
    sumMove, sumWait, sumWork, stops:(c.stops||[]).length};
}

  (c.stops||[]).forEach(st=>{ if(!st.uid) st.uid='s'+Math.random().toString(36).slice(2,9); });

function stopIndexByUid(c, uid){ return (c.stops||[]).findIndex(x=>x.uid===uid); }

function toggleCourseOrigin(on){

    c.origin={addr:($('cs-origin')?.value.trim()||base.addr||''), name:base.name||'', lat:base.lat, lng:base.lng};

async function setOrigin(){
  const addr=$('cs-origin')?.value.trim()||'';
  if(!addr){ alert('住所を入れてください'); return; }
  const own=!!$('cs-origin-own')?.checked;
  const hint=$('cs-origin-pos'); if(hint) hint.textContent='検索中…';
  const pos=await geocodeAddress(addr);
  if(!pos){ if(hint) hint.textContent='位置を取れませんでした'; alert('住所から位置を取れませんでした。番地を省いた住所でも試してみてください。'); return; }
  if(own){
    const c=curCourse();
    if(c){ c.origin={addr, name:addr, lat:pos.lat, lng:pos.lng}; await saveCourses(); renderCourse(); }
    return;
  }
  const st={...(D.settings||{})};
  st.origin={addr, lat:pos.lat, lng:pos.lng, name:addr};
  D.settings=st;
  const ok=await fbSet('shift_settings', st);
  renderCourse();
  alert(ok ? `出発地点を設定しました（${pos.src}：${pos.label||addr}）`
           : '端末には保存しましたが、サーバーへの保存に失敗しました。');
}

let _csDragFrom=null;
function csDragStart(e, uid){ _csDragFrom=uid; try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(uid)); }catch(_){} }
function csDragOver(e){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){}
  const tr=e.currentTarget; if(tr && tr.style) tr.style.outline='2px solid var(--accent)'; }
function csDragEnd(e){ document.querySelectorAll('#cs-tbody tr').forEach(tr=>tr.style.outline=''); _csDragFrom=null; }
function csDrop(e, toUid){
  e.preventDefault();
  document.querySelectorAll('#cs-tbody tr').forEach(tr=>tr.style.outline='');
  const fromUid=_csDragFrom || (e.dataTransfer?e.dataTransfer.getData('text/plain'):'');
  _csDragFrom=null;
  const c=curCourse();
  if(!c || !fromUid || fromUid===toUid) return;
  const from=stopIndexByUid(c, fromUid), to=stopIndexByUid(c, toUid);
  if(from<0 || to<0) return;
  const item=c.stops.splice(from,1)[0];
  c.stops.splice(to,0,item);
  renderCourse();
}

let _foundPos=null, _foundMarker=null;
async function zipToAddress(zip){
  const z=String(zip||'').replace(/[^0-9]/g,'');
  if(z.length!==7) return null;
  try{
    const r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+z);
    if(!r.ok) return null;
    const j=await r.json();
    const a=j&&j.results&&j.results[0];
    if(!a) return null;
    return `${a.address1}${a.address2}${a.address3}`;
  }catch(e){ console.warn('[郵便番号]', e); return null; }
}
async function mapSearch(){
  const qRaw=($('map-q')?.value||'').trim();
  const note=$('map-q-note');
  if(!qRaw){ if(note) note.textContent='郵便番号・住所・郵便局名を入れてください'; return; }
  if(note) note.textContent='検索中…';
  let q=qRaw, via='';
  // 郵便番号 → 住所
  if(/^[0-9]{3}-?[0-9]{4}$/.test(qRaw.replace(/[^0-9-]/g,''))){
    const a=await zipToAddress(qRaw);
    if(a){ q=a; via=`郵便番号 ${qRaw} → ${a}`; }
  } else if(/郵便局|営業所/.test(qRaw)){
    // 登録済みの郵便局はマスタの住所・位置を使う
    const o=(D.offices||[]).find(x=>x && x.name && x.name.includes(qRaw.replace(/\s/g,'')));
    if(o && Number(o.lat)){
      showFound({lat:Number(o.lat), lng:Number(o.lng), label:`${o.name}（登録済み）`});
      if(note) note.textContent=`${o.name} の登録位置を表示しました`;
      return;
    }
    if(o && o.addr){ q=o.addr; via=`${o.name} の所在地`; }
  }
  const pos=await geocodeAddress(q);
  if(!pos){ if(note) note.textContent='見つかりませんでした。番地を省いた住所でも試してください。'; return; }
  showFound({lat:pos.lat, lng:pos.lng, label:pos.label||q});
  if(note) note.textContent=`${via?via+' ／ ':''}${pos.src}：${pos.label||q}（地図の赤いピン）`;
}

function showFound(p, keepView){
  _foundPos=p;
  if(typeof L==='undefined' || !_csMap) return;
  if(_foundMarker){ _csMap.removeLayer(_foundMarker); _foundMarker=null; }
  const icon=L.divIcon({className:'', html:'<div style="width:18px;height:18px;border-radius:50%;background:#d9534f;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>',
    iconSize:[18,18], iconAnchor:[9,9]});
  _foundMarker=L.marker([p.lat,p.lng], {draggable:true, icon})
    .addTo(_csMap).bindPopup((p.label||'検索した地点')+'<br>ドラッグで動かせます').openPopup();
  _foundMarker.on('dragend', ev=>{
    const ll=ev.target.getLatLng();
    _foundPos={lat:Number(ll.lat.toFixed(6)), lng:Number(ll.lng.toFixed(6)), label:(p.label||'')+'（手で移動）'};
    const note=$('map-q-note');

  });
  if(!keepView) _csMap.setView([p.lat,p.lng], 17);
}

    c.stops[i].loc={lat, lng, label:label||'検索した地点'};
    renderCourse(); showFound(_foundPos);
    alert('立ち寄り先の場所にしました（コースを保存してください）');
  } else if(kind==='post'){
    const c=curCourse();
    const name=(c&&c.post) ? c.post : prompt('郵便局名を入れてください（例 都島郵便局）','');
    if(!name) return;
    const o=(D.offices||[]).find(x=>x && x.name===name);
    if(o){ o.lat=lat; o.lng=lng; if(!o.addr) o.addr=label||''; }
    else (D.offices=D.offices||[]).push({id:Date.now(), name, addr:label||'', lat, lng});
    await savePosOverride('off:'+name, lat, lng, name);
    const ok=await fbSet('offices', D.offices);
    renderCourse(); showFound(_foundPos);
    alert(ok?`${name} の位置にしました`:'端末には保存しましたが、サーバーへの保存に失敗しました。');
  }
}
async function _onMapClick(e){
  // ★ 2026-09-24.41: 出発地点・郵便局・立ち寄り先の場所を地図で直す
  if(_pickTarget){
    const t=_pickTarget; _pickTarget=null;
    const lat=Number(e.latlng.lat.toFixed(6)), lng=Number(e.latlng.lng.toFixed(6));
    if(t.kind==='origin'){
      if($('cs-origin-own')?.checked){
        const c=curCourse();
        if(c){ c.origin={addr:($('cs-origin')?.value.trim()||''), name:'このコースの出発地点', lat, lng}; await saveCourses(); renderCourse(); }
        return;
      }
      const st={...(D.settings||{})};
      st.origin={...(st.origin||{}), addr:($('cs-origin')?.value.trim()||DEFAULT_ORIGIN.addr), lat, lng, name:'出発地点'};
      D.settings=st;
      const ok=await fbSet('shift_settings', st);
      renderCourse();
      alert(ok?'出発地点を地図で設定しました':'端末には保存しましたが、サーバーへの保存に失敗しました。');
    } else if(t.kind==='office'){
      const o=(D.offices||[]).find(x=>x && x.name===t.name);
      if(o){ o.lat=lat; o.lng=lng; }
      else (D.offices=D.offices||[]).push({id:Date.now(), name:t.name, addr:'', lat, lng});
      await savePosOverride('off:'+t.name, lat, lng, t.name);
      const ok=await fbSet('offices', D.offices);
      renderCourse();
      alert(ok?`${t.name} の位置を設定しました`:'端末には保存しましたが、サーバーへの保存に失敗しました。');
    }
    return;
  }
  if(_pickStopUid){
    const uid=_pickStopUid; _pickStopUid=null;
    const c=curCourse(); if(!c) return;
    const i=stopIndexByUid(c, uid); if(i<0) return;
    const st=c.stops[i];
    const lat=Number(e.latlng.lat.toFixed(6)), lng=Number(e.latlng.lng.toFixed(6));
    if(st.type==='post'){
      const o=(D.offices||[]).find(x=>x && x.name===st.postName);
      if(o){ o.lat=lat; o.lng=lng; } else (D.offices=D.offices||[]).push({id:Date.now(), name:st.postName, addr:'', lat, lng});
      await savePosOverride('off:'+st.postName, lat, lng, st.postName);
      await fbSet('offices', D.offices);
    } else if(st.custId){
      const cu=(D.customers||[]).find(x=>String(x.id)===String(st.custId));
      if(cu){ cu.lat=lat; cu.lng=lng; await savePosOverride('cust:'+cu.id, lat, lng, cu.name); await fbSet('customers', D.customers); }
      // ★ 2026-09-24.48: 同じ顧客の行は、すべてこの位置を使うようにそろえる
      let same=0;
      (c.stops||[]).forEach(x=>{
        if(x.custId && String(x.custId)===String(st.custId) && x.loc!=='origin'){ x.loc='cust'; same++; }
      });
      renderCourse();
      alert(same>1 ? `この顧客の位置を直しました。同じ顧客の ${same}か所すべてに反映しています（次回も記憶されます）`
                   : 'この立ち寄り先の位置を直しました（次回も記憶されます）');
      return;
    }
    renderCourse();
    alert('この立ち寄り先の位置を直しました（次回も記憶されます）');
    return;
  }
  if(_pickStopIdx!=null){
    const i=_pickStopIdx; _pickStopIdx=null;
    const c=curCourse(); if(!c) return;
    c.stops[i].loc={lat:Number(e.latlng.lat.toFixed(6)), lng:Number(e.latlng.lng.toFixed(6)), label:'地図で指定'};
    renderCourse();
    alert('この立ち寄り先の場所を地図で指定しました（コースを保存してください）');
    return;
  }
  if(!_pickCustId){
    // 対象を選んでいないときは、赤いピンを置くだけ（ドラッグ＆ボタンで登録できる）
    showFound({lat:Number(e.latlng.lat.toFixed(6)), lng:Number(e.latlng.lng.toFixed(6)), label:'地図で指定した地点'}, true);
    const note=$('map-q-note');
    if(note) note.textContent='地図に赤いピンを置きました。ドラッグで微調整して、下のボタンで登録してください。';
    return;
  }
  const cu=(D.customers||[]).find(x=>String(x.id)===String(_pickCustId));
  _pickCustId=null;
  if(!cu) return;
  cu.lat=Number(e.latlng.lat.toFixed(6));
  cu.lng=Number(e.latlng.lng.toFixed(6));
  await savePosOverride('cust:'+cu.id, cu.lat, cu.lng, cu.name);
  const ok=await fbSet('customers', D.customers);
  renderCourse();
  alert(ok?`${cu.name} の位置を設定しました`:'端末には保存しましたが、サーバーへの保存に失敗しました。');
}

// ── 地図 ──
function drawMap(c){
  if(typeof L==='undefined') return;
  const el=$('cs-map'); if(!el) return;
  if(!_csMap){
    const o=courseOrigin(curCourse(), $('sh-off')?.value||'');
    _csMap=L.map(el).setView([o.lat||34.5731, o.lng||135.4829], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(_csMap);
    _csMap.on('click', _onMapClick);
  }
  if(_csLayer){ _csMap.removeLayer(_csLayer); _csLayer=null; }
  if(!c) return;
  const pts=[];
  const start=courseOrigin(c, $('sh-off').value||'');
  const group=[];
  if(start && start.lat){ pts.push([start.lat,start.lng]);
    group.push(L.marker([start.lat,start.lng]).bindPopup(`${start.name}（営業所）`)); }
  (c.stops||[]).forEach((st,i)=>{
    const p=stopPos(st, $('sh-off').value||'');
    if(!p || !p.lat) return;
    pts.push([p.lat,p.lng]);
    const selNow=(_pickStopUid===st.uid);
    const col = selNow ? '#e08b1f' : (st.type==='post' ? '#2f80ed' : st.type==='origin' ? '#009c5a' : '#d9534f');
    const icon=L.divIcon({className:'', iconSize:[24,24], iconAnchor:[12,12],
      html:`<div style="width:24px;height:24px;border-radius:50%;background:${col};color:#fff;border:2px solid #fff;
        box-shadow:0 1px 4px rgba(0,0,0,.5);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;">${i+1}</div>`});
    group.push(L.marker([p.lat,p.lng], {icon}).bindPopup(`${i+1}. ${p.name}${st.at?'（'+st.at+'）':''}<br>${p.addr||''}`));
  });
  if(c.post){
    const p=officePos(c.post);
    if(p && p.lat){ pts.push([p.lat,p.lng]); group.push(L.marker([p.lat,p.lng]).bindPopup(`${p.name}（持込）`)); }
  }
  if(start && start.lat && pts.length>1) pts.push([start.lat,start.lng]);
  if(pts.length>1) group.push(L.polyline(pts, {weight:3, opacity:.7}));
  if(!group.length) return;
  _csLayer=L.layerGroup(group).addTo(_csMap);
  try{ _csMap.fitBounds(L.latLngBounds(pts), {padding:[30,30]}); }catch(e){}
  setTimeout(()=>{ try{ _csMap.invalidateSize(); }catch(e){} }, 100);
}

function printSheet(withSale){
  const office=$('sh-off').value||'', mon=_ymNorm($('sh-mon').value||'');
  const tbl=$('sh-table'); if(!tbl) return;
  const clone=tbl.cloneNode(true);
  // 数量の列・予測の行は印刷しない
  clone.querySelectorAll('.num').forEach(el=>el.remove());
  clone.querySelectorAll('tfoot tr').forEach(tr=>{
    const h=(tr.cells[0]?.textContent||'');
    if(h.startsWith('予測')||h.startsWith('対応')||h.startsWith('過不足')) tr.remove();
  });
  clone.querySelectorAll('button, input, select').forEach(el=>el.remove());
  clone.querySelectorAll('.oth-muted').forEach(el=>el.remove());   // 印刷しない指定のもの
  // 画面用の固定幅は外し、A4横の幅に合わせる
  clone.removeAttribute('style');
  const cg=clone.querySelector('colgroup');
  if(cg){
    const cols=[...cg.querySelectorAll('col')];
    cols.forEach((c,i)=>{ c.removeAttribute('style'); if(i>0) c.className='day'; });
  }
  // ★ 2026-09-25.24: ドラッグの印を消し、白黒でも土日祝が分かるように薄いグレーにする
  clone.querySelectorAll('td, th').forEach(el=>{
    let st=(el.getAttribute('style')||'').replace(/min-width:[^;]+;?/g,'').replace(/box-shadow:[^;]+;?/g,'');
    if(/rgba\(224,\s*102,\s*102/.test(st)){        // 日曜・祝日
      st=st.replace(/background:[^;]+;?/g,'') + 'background:#e8e8e8;-webkit-print-color-adjust:exact;print-color-adjust:exact;';
    } else if(/rgba\(111,\s*168,\s*220/.test(st)){ // 土曜
      st=st.replace(/background:[^;]+;?/g,'') + 'background:#f0f0f0;-webkit-print-color-adjust:exact;print-color-adjust:exact;';
    }
    el.setAttribute('style', st);
  });
  // ★ 2026-09-25.25: ⠿ は消さず、印刷では隠すだけ（列の形は保つ）
  clone.querySelectorAll('tbody tr td:first-child span').forEach(sp=>{
    if((sp.textContent||'').trim()==='⠿') sp.className='hide-print';
  });
  clone.querySelectorAll('[draggable]').forEach(el=>el.removeAttribute('draggable'));
  // 1列目の罫線を明示的に入れる（画面では影で描いているため）
  clone.querySelectorAll('tr > *:first-child').forEach(el=>{
    el.setAttribute('style', (el.getAttribute('style')||'')
      +'border-left:1px solid #999;border-right:1px solid #999;text-align:center;');
    const box=el.querySelector('div');
    if(box) box.setAttribute('style','display:flex;align-items:center;justify-content:center;gap:2px;');
  });
  // セール予定のカレンダー（任意）
  let saleHtml='';
  if(withSale){
    const cal=document.querySelector('#sh-root > div:last-child');
    if(cal) saleHtml=`<div style="page-break-before:always;">${cal.innerHTML}</div>`;
  }
  const w=window.open('', '_blank');
  if(!w){ alert('印刷用の画面を開けませんでした。ポップアップの設定を確認してください。'); return; }
  // ★ 2026-09-25.22: A4横1枚に収める
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(office)} ${esc(mon)} シフト表</title>
    <style>
      @page{size:A4 landscape;margin:7mm;}
      html,body{margin:0;padding:0;font-family:sans-serif;}
      h1{font-size:12px;margin:0 0 4px;text-align:center;}
      /* ★ 2026-09-25.23: 人数が少なくても紙の高さいっぱいに、多くても1枚に収める */
      #sheet{height:185mm;display:flex;flex-direction:column;align-items:center;}
      table{border-collapse:collapse;table-layout:fixed;width:99.4%;height:100%;font-size:9px;
        margin:0 auto;border:1px solid #999;}
      col.day{width:2.45%;}
      th,td{border:1px solid #999;padding:0 1px;text-align:center;overflow:hidden;
        white-space:nowrap;text-overflow:ellipsis;line-height:1.1;}
      td:first-child,th:first-child{text-align:center;width:10%;}
      thead th{vertical-align:middle;}
      thead th{background:#eee;}
      tbody tr{height:auto;}
      div[style*="grid-template-columns"]{font-size:8px;}
      .hide-print{display:none;}
      .page{page-break-before:always;}
    </style></head><body>
    <h1>${esc(office)}　${esc(mon)}　シフト表</h1>
    <div id="sheet">${clone.outerHTML}</div>${saleHtml}
    <script>
      window.onload=()=>{
        // 行数に応じて文字の大きさを調整し、1枚に収める
        const t=document.querySelector('#sheet table');
        const rows=t?t.querySelectorAll('tbody tr').length:0;
        if(t){
          const sheet=document.getElementById('sheet');
          let fs = rows<=8 ? 11 : rows<=12 ? 10 : rows<=16 ? 9 : rows<=22 ? 8 : 7;
          t.style.fontSize=fs+'px';
          // 1行が太くなりすぎないよう上限（26px）を設け、余った分は下に余白として残す
          const maxRow=26;
          const avail=sheet.clientHeight;
          const wanted=Math.min(avail, rows*maxRow+60);
          t.style.height=wanted+'px';
          for(let i=0;i<14 && t.scrollHeight>avail+2;i++){
            fs=Math.max(5, fs-0.5); t.style.fontSize=fs+'px';
          }
        }
        window.print();
      };
    <\/script></body></html>`);
  w.document.close();
}
